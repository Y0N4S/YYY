<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Video Library</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--text:#1f1f1d;--muted:#6b6a66;--accent:#d9622b;--border:#e2e0da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f0efeb;--muted:#9a9890;--accent:#ef8a55;--border:#38372f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f0efeb;--muted:#9a9890;--accent:#ef8a55;--border:#38372f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
.player{background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px;display:none}
.player video{width:100%;max-height:70vh;display:block;background:#000}
.now{display:none;margin:0 0 20px;font-weight:600;word-break:break-word}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px 16px;text-align:center;background:var(--card);cursor:pointer;margin-bottom:24px;transition:border-color .15s}
.drop.over,.drop:hover{border-color:var(--accent)}
.drop strong{color:var(--accent)}
.drop small{display:block;color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item.active{outline:2px solid var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;border:0;padding:0;width:100%}
.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb span{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;background:rgba(0,0,0,.25)}
.meta{padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.meta div{min-width:0}
.name{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size{font-size:.75rem;color:var(--muted)}
button.del{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.8rem}
button.del:hover{color:#c0392b;border-color:#c0392b}
.empty,.msg{color:var(--muted);text-align:center;padding:20px}
.msg{color:#c0392b;padding:0 0 12px}
</style>
</head>
<body>
<main>
  <h1>My Video Library</h1>
  <p class="sub">Add videos, and they’re saved in this browser so they’ll still be here next time you visit.</p>

  <div class="player" id="playerWrap"><video id="player" controls playsinline></video></div>
  <p class="now" id="now"></p>

  <div class="msg" id="msg" hidden></div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add videos">
    <strong>Click to add videos</strong> or drag and drop them here
    <small>Stored privately on this device only</small>
  </div>
  <input type="file" id="file" accept="video/*" multiple hidden>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No videos yet.</div>
</main>

<script>
(function(){
  var DB_NAME='video-library', STORE='videos', db=null, memory=[], urls={}, activeId=null;
  var $=function(id){return document.getElementById(id)};
  var grid=$('grid'), player=$('player'), wrap=$('playerWrap'), now=$('now'), msg=$('msg');

  function openDB(){
    return new Promise(function(res){
      try{
        var req=indexedDB.open(DB_NAME,1);
        req.onupgradeneeded=function(){req.result.createObjectStore(STORE,{keyPath:'id'})};
        req.onsuccess=function(){res(req.result)};
        req.onerror=function(){res(null)};
      }catch(e){res(null)}
    });
  }
  function tx(mode,fn){
    return new Promise(function(res,rej){
      if(!db){res(null);return}
      try{
        var t=db.transaction(STORE,mode), s=t.objectStore(STORE), r=fn(s);
        t.oncomplete=function(){res(r&&r.result)};
        t.onerror=t.onabort=function(){rej(t.error)};
      }catch(e){rej(e)}
    });
  }
  function fmt(b){
    if(b<1048576)return Math.max(1,Math.round(b/1024))+' KB';
    if(b<1073741824)return (b/1048576).toFixed(1)+' MB';
    return (b/1073741824).toFixed(2)+' GB';
  }
  function showMsg(t){msg.textContent=t;msg.hidden=!t}

  async function load(){
    try{var all=await tx('readonly',function(s){return s.getAll()});memory=all||[]}catch(e){showMsg('Couldn’t read saved videos.')}
    memory.sort(function(a,b){return b.added-a.added});
    render();
  }
  function urlFor(v){
    if(!urls[v.id])urls[v.id]=URL.createObjectURL(v.blob);
    return urls[v.id];
  }
  function render(){
    grid.textContent='';
    $('empty').style.display=memory.length?'none':'block';
    memory.forEach(function(v){
      var item=document.createElement('div');item.className='item'+(v.id===activeId?' active':'');
      var th=document.createElement('button');th.className='thumb';th.type='button';th.setAttribute('aria-label','Play '+v.name);
      var vid=document.createElement('video');vid.muted=true;vid.preload='metadata';vid.src=urlFor(v)+'#t=0.5';
      var ic=document.createElement('span');ic.textContent='\u25B6';
      th.append(vid,ic);th.onclick=function(){play(v.id)};
      var meta=document.createElement('div');meta.className='meta';
      var info=document.createElement('div');
      var n=document.createElement('div');n.className='name';n.textContent=v.name;n.title=v.name;
      var sz=document.createElement('div');sz.className='size';sz.textContent=fmt(v.blob.size);
      info.append(n,sz);
      var del=document.createElement('button');del.className='del';del.textContent='Delete';
      del.onclick=function(){remove(v.id)};
      meta.append(info,del);item.append(th,meta);grid.append(item);
    });
  }
  function play(id){
    var v=memory.find(function(x){return x.id===id});if(!v)return;
    activeId=id;player.src=urlFor(v);wrap.style.display='block';
    now.style.display='block';now.textContent=v.name;
    player.play().catch(function(){});
    wrap.scrollIntoView({behavior:'smooth',block:'start'});render();
  }
  async function remove(id){
    if(!confirm('Delete this video?'))return;
    try{await tx('readwrite',function(s){return s.delete(id)})}catch(e){}
    if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}
    memory=memory.filter(function(x){return x.id!==id});
    if(activeId===id){player.pause();player.removeAttribute('src');player.load();wrap.style.display='none';now.style.display='none';activeId=null}
    render();
  }
  async function add(files){
    showMsg('');var skipped=0,failed=false;
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(!f.type.startsWith('video/')){skipped++;continue}
      var rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:f.name,blob:f,added:Date.now()};
      try{await tx('readwrite',function(s){return s.put(rec)})}catch(e){failed=true}
      memory.unshift(rec);
    }
    if(!db||failed)showMsg('Saved for this session only — this browser blocked permanent storage.');
    else if(skipped)showMsg(skipped+' file(s) skipped because they aren’t videos.');
    render();
  }

  var drop=$('drop'),input=$('file');
  drop.onclick=function(){input.click()};
  drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};
  input.onchange=function(){add(Array.from(input.files));input.value=''};
  ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){add(Array.from(e.dataTransfer.files))});

  openDB().then(function(d){db=d;return load()});
})();
</script>
</body>
</html>
