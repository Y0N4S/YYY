<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Maps Clone</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e5e3df;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Hide default Leaflet zoom controls (we build custom bottom-right Google-style controls) */
    .leaflet-control-zoom {
      display: none !important;
    }

    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(255, 255, 255, 0.78) !important;
      backdrop-filter: blur(4px);
      padding: 2px 6px !important;
      border-top-left-radius: 6px;
      color: #5f6368 !important;
    }

    /* Custom Scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .thin-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 9999px;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #bdc1c6;
    }

    /* Google Pin Drop Animation */
    @keyframes pinDrop {
      0% {
        transform: translateY(-24px) scale(0.8);
        opacity: 0;
      }
      70% {
        transform: translateY(3px) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .google-pin-wrapper {
      animation: pinDrop 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* User Pulse Dot */
    @keyframes userPulse {
      0% {
        transform: scale(0.85);
        opacity: 0.75;
      }
      70% {
        transform: scale(2.2);
        opacity: 0;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .user-pulse-ring {
      animation: userPulse 2s infinite ease-out;
    }

    /* Street View Panoramic Simulation */
    .streetview-panorama {
      background-size: 200% 100%;
      transition: background-position 0.1s linear;
      cursor: grab;
    }
    .streetview-panorama:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="relative w-full h-full select-none text-[#202124]">

  <!-- Full-Viewport Interactive Map -->
  <div id="map"></div>

  <!-- Top Floating Search Bar + Category Chips -->
  <div id="top-ui-container" class="fixed top-3 left-3 right-3 sm:right-auto z-30 flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 pointer-events-none">
    
    <!-- Search Pill Box -->
    <div class="relative w-full sm:w-[392px] pointer-events-auto">
      <div class="flex items-center bg-white rounded-full shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 h-12 px-3 transition-shadow focus-within:shadow-[0_4px_12px_rgba(60,64,67,0.32)]">
        <!-- Hamburger / Saved Places Menu Button -->
        <button id="btn-menu" title="Saved places & menu" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Search Input -->
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          placeholder="Search Google Maps"
          class="w-full px-2.5 text-[15px] text-[#202124] placeholder-[#70757a] bg-transparent outline-none"
        />

        <!-- Clear Search Button -->
        <button id="btn-clear-search" title="Clear search" class="hidden p-1.5 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <!-- Search Submit Button -->
        <button id="btn-search-submit" title="Search" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>

        <!-- Vertical Divider -->
        <div class="h-6 w-[1px] bg-gray-200 mx-1 flex-shrink-0"></div>

        <!-- Directions Blue Diamond Button -->
        <button id="btn-open-directions" title="Directions" class="p-2 rounded-full hover:bg-blue-50 text-[#1A73E8] transition-colors flex-shrink-0">
          <div class="w-6 h-6 bg-[#1A73E8] rounded-md rotate-45 flex items-center justify-center shadow-sm">
            <i data-lucide="corner-up-right" class="w-3.5 h-3.5 text-white -rotate-45"></i>
          </div>
        </button>
      </div>

      <!-- Search Autocomplete Dropdown -->
      <div id="search-dropdown" class="hidden mt-1.5 bg-white rounded-2xl shadow-[0_4px_16px_rgba(60,64,67,0.28)] border border-gray-100 overflow-hidden max-h-[340px] overflow-y-auto thin-scrollbar">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Horizontal Category Chips -->
    <div id="category-chips" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 pointer-events-auto max-w-full sm:max-w-[calc(100vw-430px)]">
      <button data-category="restaurant" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="utensils" class="w-4 h-4 text-[#EA4335]"></i>
        <span>Restaurants</span>
      </button>
      <button data-category="cafe" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="coffee" class="w-4 h-4 text-[#9334E6]"></i>
        <span>Coffee</span>
      </button>
      <button data-category="hotel" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="bed" class="w-4 h-4 text-[#E52592]"></i>
        <span>Hotels</span>
      </button>
      <button data-category="park" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="trees" class="w-4 h-4 text-[#188038]"></i>
        <span>Parks</span>
      </button>
      <button data-category="transit" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="train-front" class="w-4 h-4 text-[#1A73E8]"></i>
        <span>Transit</span>
      </button>
      <button data-category="gas" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="fuel" class="w-4 h-4 text-[#F9AB00]"></i>
        <span>Gas</span>
      </button>
      <button data-category="museum" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="landmark" class="w-4 h-4 text-[#12B5CB]"></i>
        <span>Museums</span>
      </button>
    </div>
  </div>

  <!-- Left Collapsible Side Drawer (Place Details / Directions / Saved Places) -->
  <aside
    id="side-drawer"
    class="fixed left-0 top-0 bottom-0 w-full sm:w-[408px] bg-white shadow-[4px_0_18px_rgba(60,64,67,0.24)] z-20 transform -translate-x-full transition-transform duration-300 ease-out flex flex-col pt-20 sm:pt-[74px]"
  >
    <!-- Drawer Close / Collapse Handle (Desktop) -->
    <button
      id="btn-close-drawer"
      title="Close panel"
      class="hidden sm:flex items-center justify-center absolute -right-6 top-1/2 -translate-y-1/2 w-6 h-12 bg-white rounded-r-lg shadow-[2px_0_8px_rgba(60,64,67,0.2)] border-y border-r border-gray-200 text-[#5f6368] hover:text-[#202124]"
    >
      <i data-lucide="chevron-left" class="w-4 h-4"></i>
    </button>

    <!-- Mobile Close Top Bar -->
    <div class="flex sm:hidden items-center justify-between px-4 py-2 border-b border-gray-100">
      <span id="mobile-drawer-title" class="text-xs font-semibold uppercase tracking-wider text-[#5f6368]">Details</span>
      <button id="btn-close-drawer-mobile" class="p-1.5 rounded-full hover:bg-gray-100 text-[#5f6368]">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Drawer Content Body -->
    <div id="drawer-body" class="flex-1 overflow-y-auto thin-scrollbar">
      <!-- Dynamically populated with Place Details, Directions, or Saved Places -->
    </div>
  </aside>

  <!-- Bottom-Left Layers Thumbnail Switcher -->
  <div id="layers-widget" class="fixed bottom-5 left-3 z-20 flex items-end gap-2.5">
    <!-- Main Layers Square Button -->
    <button
      id="btn-toggle-layers"
      class="group relative w-[74px] h-[74px] rounded-xl overflow-hidden bg-white p-1 shadow-[0_2px_8px_rgba(60,64,67,0.3)] border border-white hover:scale-[1.02] transition-transform"
    >
      <div id="layers-preview-bg" class="w-full h-full rounded-lg bg-gradient-to-br from-emerald-100 via-amber-50 to-sky-200 relative overflow-hidden">
        <!-- Mini stylized road grid -->
        <div class="absolute inset-0 opacity-60">
          <div class="w-full h-1.5 bg-amber-300 rotate-12 translate-y-4"></div>
          <div class="w-1.5 h-full bg-white -rotate-12 translate-x-6"></div>
          <div class="w-5 h-5 rounded-full bg-sky-300/70 absolute top-2 right-2"></div>
        </div>
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/40 to-transparent py-1 px-1.5 flex items-center justify-center gap-1 text-white">
          <i data-lucide="layers" class="w-3 h-3"></i>
          <span class="text-[11px] font-medium tracking-tight">Layers</span>
        </div>
      </div>
    </button>

    <!-- Expandable Layer Options Popover -->
    <div
      id="layers-popover"
      class="hidden bg-white rounded-2xl shadow-[0_4px_16px_rgba(60,64,67,0.28)] border border-gray-100 p-3.5 w-[272px]"
    >
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-semibold text-[#5f6368] uppercase tracking-wider">Map Type</span>
        <button id="btn-close-layers" class="p-1 rounded-full hover:bg-gray-100 text-[#5f6368]">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-3.5">
        <button data-layer="default" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-[#1A73E8] bg-gradient-to-br from-emerald-100 via-amber-50 to-sky-200 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="map" class="w-5 h-5 text-[#1A73E8]"></i>
          </div>
          <span class="text-[11px] font-medium text-[#1A73E8]">Default</span>
        </button>
        <button data-layer="satellite" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-slate-800 via-emerald-900 to-teal-900 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="globe" class="w-5 h-5 text-emerald-300"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Satellite</span>
        </button>
        <button data-layer="terrain" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-lime-200 via-stone-200 to-emerald-200 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="mountain" class="w-5 h-5 text-emerald-800"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Terrain</span>
        </button>
        <button data-layer="dark" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-zinc-900 via-slate-900 to-neutral-800 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="moon" class="w-5 h-5 text-indigo-300"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Dark</span>
        </button>
      </div>

      <div class="border-t border-gray-100 pt-2.5">
        <span class="text-xs font-semibold text-[#5f6368] uppercase tracking-wider block mb-2">Map Details</span>
        <div class="grid grid-cols-2 gap-2">
          <button id="toggle-transit-overlay" class="flex items-center gap-2 px-2.5 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-xs font-medium text-[#3c4043] transition-colors">
            <i data-lucide="train-front" class="w-4 h-4 text-[#1A73E8]"></i>
            <span>Transit</span>
          </button>
          <button id="toggle-traffic-overlay" class="flex items-center gap-2 px-2.5 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-xs font-medium text-[#3c4043] transition-colors">
            <i data-lucide="car" class="w-4 h-4 text-[#188038]"></i>
            <span>Traffic</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom-Right Navigation Controls (Locate Me, Zoom +/-, Pegman Street View) -->
  <div class="fixed bottom-6 right-3 z-20 flex flex-col items-center gap-2.5">
    <!-- Locate Me Button -->
    <button
      id="btn-locate-me"
      title="Show your location"
      class="w-10 h-10 bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex items-center justify-center text-[#5f6368] hover:text-[#1A73E8] hover:bg-gray-50 transition-colors"
    >
      <i data-lucide="locate-fixed" class="w-5 h-5"></i>
    </button>

    <!-- Zoom In / Out Pill -->
    <div class="bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex flex-col overflow-hidden">
      <button
        id="btn-zoom-in"
        title="Zoom in"
        class="w-10 h-10 flex items-center justify-center text-[#5f6368] hover:text-[#202124] hover:bg-gray-50 transition-colors border-b border-gray-100"
      >
        <i data-lucide="plus" class="w-5 h-5"></i>
      </button>
      <button
        id="btn-zoom-out"
        title="Zoom out"
        class="w-10 h-10 flex items-center justify-center text-[#5f6368] hover:text-[#202124] hover:bg-gray-50 transition-colors"
      >
        <i data-lucide="minus" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Pegman / Street View Button -->
    <button
      id="btn-street-view"
      title="Browse Street View"
      class="w-10 h-10 bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex items-center justify-center text-[#F9AB00] hover:bg-amber-50 transition-colors"
    >
      <i data-lucide="person-standing" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Toast Notification Pill (Replaces any alert()) -->
  <div
    id="toast-banner"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 pointer-events-none opacity-0 translate-y-3 transition-all duration-300 bg-[#202124] text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2"
  >
    <span id="toast-message">Notification</span>
  </div>

  <!-- Simulated 360° Street View Modal -->
  <div id="streetview-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col">
    <!-- Top Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent text-white z-10">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-[#F9AB00]/20 border border-[#F9AB00] flex items-center justify-center text-[#F9AB00]">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="sv-title" class="text-sm font-semibold">Street View — Downtown Toronto</h3>
          <p id="sv-coords" class="text-xs text-gray-300">43.6532° N, 79.3832° W • Drag horizontally to look around 360°</p>
        </div>
      </div>
      <button id="btn-close-streetview" class="p-2 rounded-full bg-white/15 hover:bg-white/25 text-white transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Interactive Draggable Panorama Canvas -->
    <div
      id="sv-panorama"
      class="streetview-panorama flex-1 relative overflow-hidden flex items-center justify-center"
      style="background-image: url('https://images.unsplash.com/photo-1517090504586-fde19ea6066f?auto=format&fit=crop&w=2400&q=80'); background-position: 50% 50%;"
    >
      <!-- Simulated Ground Direction Arrows -->
      <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-6 pointer-events-none">
        <div class="px-4 py-2 rounded-full bg-black/55 backdrop-blur-md border border-white/25 text-white text-xs flex items-center gap-2">
          <i data-lucide="move-horizontal" class="w-4 h-4 text-[#F9AB00]"></i>
          <span>Drag left or right to pan 360°</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. STATE & CURATED TORONTO PLACE DATASET
    // =========================================================================
    const DEFAULT_CENTER = [43.6532, -79.3832]; // Fallback Toronto center
    const DEFAULT_ZOOM = 14;

    const state = {
      map: null,
      activeBaseLayer: 'default',
      baseLayers: {},
      transitLayer: null,
      trafficLayer: null,
      transitActive: false,
      trafficActive: false,
      markersLayer: null,
      routeLayer: null,
      userMarker: null,
      selectedPlace: null,
      activeCategory: null,
      drawerMode: null, // 'place' | 'directions' | 'saved'
      travelMode: 'driving', // 'driving' | 'walking' | 'cycling' | 'transit'
      originCoords: [43.6452, -79.3806], // Initial fallback origin
      originLabel: 'Your Location',
      destCoords: null,
      destLabel: '',
      savedPlaces: JSON.parse(localStorage.getItem('gmaps_clone_saved') || '[]'),
      svPanX: 50,
      svDragging: false,
      svStartX: 0
    };

    // Category Metadata lookup table
    const CATEGORY_META = {
      restaurant: { query: 'restaurant', color: '#EA4335', label: 'Restaurants' },
      cafe: { query: 'cafe', color: '#9334E6', label: 'Coffee' },
      hotel: { query: 'hotel', color: '#E52592', label: 'Hotels' },
      park: { query: 'park', color: '#188038', label: 'Parks' },
      transit: { query: 'station', color: '#1A73E8', label: 'Transit' },
      gas: { query: 'fuel', color: '#F9AB00', label: 'Gas Stations' },
      museum: { query: 'museum', color: '#12B5CB', label: 'Museums' },
      default: { query: 'attraction', color: '#EA4335', label: 'Place' }
    };

    // =========================================================================
    // 2. MAP INITIALIZATION & ESRI TILE LAYERS
    // =========================================================================
    function initMap() {
      state.map = L.map('map', {
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,
        zoomControl: false
      });

      // Keyless Esri Map Server layers
      state.baseLayers = {
        default: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri',
          maxZoom: 19
        }),
        satellite: L.layerGroup([
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
          }),
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Labels &copy; Esri',
            maxZoom: 19,
            opacity: 0.9
          })
        ]),
        terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri',
          maxZoom: 19
        }),
        dark: L.layerGroup([
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
          }),
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Labels &copy; Esri',
            maxZoom: 16
          })
        ])
      };

      state.baseLayers.default.addTo(state.map);

      // Overlays
      const transportOverlay = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Transportation &copy; Esri',
        opacity: 0.75,
        maxZoom: 19
      });

      state.transitLayer = L.layerGroup([transportOverlay]);
      state.trafficLayer = L.layerGroup([transportOverlay]);
      state.markersLayer = L.layerGroup().addTo(state.map);
      state.routeLayer = L.layerGroup().addTo(state.map);
    }

    // =========================================================================
    // 3. SEARCH, NOMINATIM GEOCODING & CATEGORIES
    // =========================================================================
    function initSearchAndChips() {
      const searchInput = document.getElementById('search-input');
      const searchDropdown = document.getElementById('search-dropdown');
      const clearBtn = document.getElementById('btn-clear-search');

      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        clearBtn.classList.toggle('hidden', val.length === 0);
        if (val.length < 2) {
          searchDropdown.classList.add('hidden');
          return;
        }
        fetchNominatimSuggestions(val);
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        searchDropdown.classList.add('hidden');
        searchInput.focus();
      });

      document.getElementById('btn-search-submit').addEventListener('click', () => {
        const val = searchInput.value.trim();
        if (val) performSearch(val);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = searchInput.value.trim();
          if (val) performSearch(val);
        }
      });

      document.querySelectorAll('.category-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.category;
          document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('ring-2', 'ring-[#1A73E8]'));
          btn.classList.add('ring-2', 'ring-[#1A73E8]');
          state.activeCategory = cat;
          searchCategoryPlaces(cat);
        });
      });
    }

    async function fetchNominatimSuggestions(query) {
      const searchDropdown = document.getElementById('search-dropdown');
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&addressdetails=1`);
        const data = await res.json();

        if (!data || data.length === 0) {
          searchDropdown.innerHTML = `<div class="px-4 py-3 text-xs text-[#70757a]">No matching places found</div>`;
          searchDropdown.classList.remove('hidden');
          return;
        }

        searchDropdown.innerHTML = data.map(item => `
          <div class="search-item flex items-center gap-3 px-4 py-2.5 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0 transition-colors"
               data-lat="${item.lat}" data-lon="${item.lon}" data-name="${item.display_name}">
            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-[#1A73E8] flex-shrink-0">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-[#202124] truncate">${item.display_name.split(',')[0]}</p>
              <p class="text-xs text-[#70757a] truncate">${item.display_name}</p>
            </div>
          </div>
        `).join('');

        lucide.createIcons();
        searchDropdown.classList.remove('hidden');

        searchDropdown.querySelectorAll('.search-item').forEach(el => {
          el.addEventListener('click', () => {
            const lat = parseFloat(el.dataset.lat);
            const lon = parseFloat(el.dataset.lon);
            const name = el.dataset.name;
            document.getElementById('search-input').value = name.split(',')[0];
            searchDropdown.classList.add('hidden');
            selectPlace({
              name: name.split(',')[0],
              address: name,
              lat: lat,
              lng: lon,
              category: 'default',
              rating: (4.2 + Math.random() * 0.7).toFixed(1),
              reviewsCount: Math.floor(120 + Math.random() * 850),
              photo: 'https://images.unsplash.com/photo-1517090504586-fde19ea6066f?auto=format&fit=crop&w=1200&q=80'
            });
          });
        });
      } catch (err) {
        console.error('Nominatim error:', err);
      }
    }

    async function performSearch(query) {
      const searchDropdown = document.getElementById('search-dropdown');
      searchDropdown.classList.add('hidden');
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const item = data[0];
          selectPlace({
            name: item.display_name.split(',')[0],
            address: item.display_name,
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lon),
            category: 'default',
            rating: '4.6',
            reviewsCount: 342,
            photo: 'https://images.unsplash.com/photo-1517090504586-fde19ea6066f?auto=format&fit=crop&w=1200&q=80'
          });
        } else {
          showToast('Location not found');
        }
      } catch (e) {
        showToast('Search failed');
      }
    }

    async function searchCategoryPlaces(categoryKey) {
      const meta = CATEGORY_META[categoryKey] || CATEGORY_META.default;
      const center = state.map.getCenter();
      state.markersLayer.clearLayers();

      showToast(`Searching for ${meta.label} nearby...`);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(meta.query)}&bounded=1&viewbox=${center.lng-0.08},${center.lat+0.08},${center.lng+0.08},${center.lat-0.08}&limit=12`);
        const data = await res.json();

        if (!data || data.length === 0) {
          showToast(`No ${meta.label} found in this viewport`);
          return;
        }

        data.forEach(item => {
          const place = {
            name: item.display_name.split(',')[0],
            address: item.display_name,
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lon),
            category: categoryKey,
            rating: (4.1 + Math.random() * 0.8).toFixed(1),
            reviewsCount: Math.floor(45 + Math.random() * 600),
            photo: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80'
          };
          addPinToMap(place);
        });

        showToast(`Found ${data.length} ${meta.label}`);
      } catch (err) {
        showToast('Failed to fetch category results');
      }
    }

    async function calculateAndDrawRoute() {
      const stepsContainer = document.getElementById('route-steps-container');
      state.routeLayer.clearLayers();

      const [origLat, origLng] = state.originCoords;
      const [destLat, destLng] = state.destCoords;

      const profileMap = {
        driving: 'driving',
        walking: 'walking',
        cycling: 'cycling',
        transit: 'driving' // OSRM fallback for transit
      };
      const profile = profileMap[state.travelMode] || 'driving';

      try {
        const url = `https://router.project-osrm.org/route/v1/${profile}/${origLng},${origLat};${destLng},${destLat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || data.routes.length === 0) {
          stepsContainer.innerHTML = `<p class="text-sm text-red-500 text-center py-4">Could not calculate route.</p>`;
          return;
        }

        const route = data.routes[0];
        const distanceKm = (route.distance / 1000).toFixed(1);
        const durationMin = Math.round(route.duration / 60);

        // Draw polyline on map
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        const polyline = L.polyline(coords, {
          color: '#1A73E8',
          weight: 6,
          opacity: 0.85
        }).addTo(state.routeLayer);

        state.map.fitBounds(polyline.getBounds(), { padding: [60, 60] });

        // Populate step-by-step UI
        let stepsHtml = `
          <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-4">
            <div class="flex items-center justify-between">
              <span class="text-lg font-bold text-[#1A73E8]">${durationMin} min</span>
              <span class="text-xs font-semibold text-[#5f6368]">${distanceKm} km</span>
            </div>
            <p class="text-xs text-[#70757a] mt-0.5">Fastest route considering current traffic</p>
          </div>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-[#5f6368] mb-3">Turn-by-turn directions</h3>
          <div class="space-y-3">
        `;

        const legs = route.legs[0].steps;
        legs.forEach((step, idx) => {
          const instruction = step.maneuver.instruction || 'Continue straight';
          const dist = step.distance > 100 ? `${Math.round(step.distance)} m` : `${Math.round(step.distance)} m`;
          stepsHtml += `
            <div class="flex items-start gap-3 text-sm pb-3 border-b border-gray-100 last:border-0">
              <div class="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center text-[#5f6368] text-xs font-bold flex-shrink-0 mt-0.5">${idx + 1}</div>
              <div class="flex-1">
                <p class="text-[#202124] font-medium">${instruction}</p>
                <p class="text-xs text-[#70757a] mt-0.5">${dist}</p>
              </div>
            </div>
          `;
        });

        stepsHtml += `</div>`;
        stepsContainer.innerHTML = stepsHtml;
      } catch (err) {
        stepsContainer.innerHTML = `<p class="text-sm text-red-500 text-center py-4">Routing network error.</p>`;
      }
    }

    // =========================================================================
    // 7. STREET VIEW DRAG INTERACTION
    // =========================================================================
    function initStreetViewDrag() {
      const pano = document.getElementById('streetview-panorama');
      if (!pano) return;

      pano.addEventListener('mousedown', (e) => {
        state.svDragging = true;
        state.svStartX = e.clientX;
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.svDragging) return;
        const deltaX = e.clientX - state.svStartX;
        state.svPanX = (state.svPanX - deltaX * 0.15) % 200;
        if (state.svPanX < 0) state.svPanX += 200;
        pano.style.backgroundPosition = `${state.svPanX}% 50%`;
        state.svStartX = e.clientX;
      });

      window.addEventListener('mouseup', () => {
        state.svDragging = false;
      });

      // Touch support for mobile
      pano.addEventListener('touchstart', (e) => {
        state.svDragging = true;
        state.svStartX = e.touches[0].clientX;
      });

      window.addEventListener('touchmove', (e) => {
        if (!state.svDragging) return;
        const deltaX = e.touches[0].clientX - state.svStartX;
        state.svPanX = (state.svPanX - deltaX * 0.15) % 200;
        if (state.svPanX < 0) state.svPanX += 200;
        pano.style.backgroundPosition = `${state.svPanX}% 50%`;
        state.svStartX = e.touches[0].clientX;
      });

      window.addEventListener('touchend', () => {
        state.svDragging = false;
      });
    }

    function switchBaseLayer(layerKey) {
      if (state.activeBaseLayer === layerKey) return;
      state.map.removeLayer(state.baseLayers[state.activeBaseLayer]);
      state.baseLayers[layerKey].addTo(state.map);
      state.activeBaseLayer = layerKey;

      document.querySelectorAll('.layer-option').forEach((btn) => {
        const active = btn.dataset.layer === layerKey;
        const box = btn.querySelector('div');
        const label = btn.querySelector('span');
        if (active) {
          box.classList.add('border-[#1A73E8]');
          box.classList.remove('border-transparent');
          label.classList.add('text-[#1A73E8]');
          label.classList.remove('text-[#5f6368]');
        } else {
          box.classList.remove('border-[#1A73E8]');
          box.classList.add('border-transparent');
          label.classList.remove('text-[#1A73E8]');
          label.classList.add('text-[#5f6368]');
        }
      });
    }

    function locateUser(silent = false) {
      if (!navigator.geolocation) {
        if (!silent) showToast('Geolocation is not supported by your browser');
        return;
      }
      if (!silent) showToast('Locating your device position...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          state.originCoords = [latitude, longitude];
          state.originLabel = 'Your Location';

          if (state.userMarker) state.map.removeLayer(state.userMarker);
          state.userMarker = L.marker([latitude, longitude], {
            icon: L.divIcon({
              className: 'user-location-dot',
              iconSize: [24, 24],
              iconAnchor: [12, 12],
              html: `
                <div class="relative w-6 h-6 flex items-center justify-center">
                  <div class="user-pulse-ring absolute inset-0 rounded-full bg-[#1A73E8]"></div>
                  <div class="relative w-4 h-4 rounded-full bg-[#1A73E8] border-2 border-white shadow-md"></div>
                </div>
              `
            })
          }).addTo(state.map);

          state.map.flyTo([latitude, longitude], 15, { duration: 0.85 });
          if (!silent) showToast('Centered on your device location');
        },
        () => {
          if (!silent) {
            state.map.flyTo(DEFAULT_CENTER, DEFAULT_ZOOM, { duration: 0.8 });
            showToast('Using default Toronto region');
          }
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function openStreetView(place = null) {
      const modal = document.getElementById('streetview-modal');
      const titleEl = document.getElementById('sv-title');
      const center = place ? { lat: place.lat, lng: place.lng } : state.map.getCenter();
      titleEl.textContent = place ? `Street View — ${place.name}` : 'Street View 360°';
      if (place?.photo) {
        document.getElementById('sv-panorama').style.backgroundImage = `url('${place.photo}')`;
      }
      modal.classList.remove('hidden');
    }

    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-message').textContent = msg;
      banner.classList.remove('opacity-0', 'translate-y-3');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => banner.classList.add('opacity-0', 'translate-y-3'), 2800);
    }

    // =========================================================================
    // 9. BOOTSTRAP ALL EVENT LISTENERS ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      initSearchAndChips();
      initStreetViewDrag();

      // Automatically request and center on user's device location on startup
      locateUser(true);

      // Top Menu & Directions Buttons
      document.getElementById('btn-menu').addEventListener('click', () => {
        if (state.drawerMode === 'saved') {
          closeDrawer();
        } else {
          openSavedPlacesDrawer();
        }
      });

      document.getElementById('btn-open-directions').addEventListener('click', () => {
        if (state.selectedPlace) {
          state.destCoords = [state.selectedPlace.lat, state.selectedPlace.lng];
          state.destLabel = state.selectedPlace.name;
        }
        openDirectionsDrawer();
      });

      document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
      document.getElementById('btn-close-drawer-mobile').addEventListener('click', closeDrawer);

      const layersPopover = document.getElementById('layers-popover');
      document.getElementById('btn-toggle-layers').addEventListener('click', () => layersPopover.classList.toggle('hidden'));
      document.getElementById('btn-close-layers').addEventListener('click', () => layersPopover.classList.add('hidden'));

      document.querySelectorAll('.layer-option').forEach((btn) => {
        btn.addEventListener('click', () => switchBaseLayer(btn.dataset.layer));
      });

      document.getElementById('toggle-transit-overlay').addEventListener('click', () => {
        state.transitActive = !state.transitActive;
        if (state.transitActive) state.transitLayer.addTo(state.map);
        else state.map.removeLayer(state.transitLayer);
        showToast(state.transitActive ? 'Transit enabled' : 'Transit hidden');
      });

      document.getElementById('toggle-traffic-overlay').addEventListener('click', () => {
        state.trafficActive = !state.trafficActive;
        if (state.trafficActive) state.trafficLayer.addTo(state.map);
        else state.map.removeLayer(state.trafficLayer);
        showToast(state.trafficActive ? 'Traffic enabled' : 'Traffic hidden');
      });

      document.getElementById('btn-zoom-in').addEventListener('click', () => state.map.zoomIn());
      document.getElementById('btn-zoom-out').addEventListener('click', () => state.map.zoomOut());
      document.getElementById('btn-locate-me').addEventListener('click', locateUser);
      document.getElementById('btn-street-view').addEventListener('click', () => openStreetView(state.selectedPlace));
      document.getElementById('btn-close-streetview').addEventListener('click', () => document.getElementById('streetview-modal').classList.add('hidden'));
    });
  </script>
</body>
</html>
