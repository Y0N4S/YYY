<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First-Person Map</title>
<style>
  :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); --edge:rgba(255,255,255,.18); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); } }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fb7c9; font-family: system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; width:100%; height:100%; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(8,10,14,.45); }
  #card { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:22px 28px; max-width:340px; line-height:1.5; }
  #card h1 { margin:0 0 8px; font-size:20px; }
  #card p { margin:4px 0; font-size:14px; }
  kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:1px 6px; font-size:12px; }
  #cross { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px; border-radius:50%; background:#fff; mix-blend-mode:difference; pointer-events:none; }
  #ratio { position:fixed; z-index:5; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; width:230px; background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:8px 12px; font:12px system-ui, sans-serif; }
  #ratio input { width:100%; margin:6px 0 2px; }
  #ratio .hint { opacity:.7; margin-top:4px; }
  #credit { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:11px system-ui, sans-serif; background:var(--panel); padding:5px 9px; border-radius:6px; pointer-events:none; text-align:right; }
  #hud { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:12px ui-monospace, monospace; background:var(--panel); padding:6px 10px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="cross"></div>
<div id="hud"></div>
<div id="credit"></div>
<div id="ratio">
  <label for="rs">Map scale</label>
  <input id="rs" type="range">
  <div id="rv"></div>
  <div class="hint">Keys: <kbd>[</kbd> zoom in, <kbd>]</kbd> zoom out</div>
</div>
<div id="overlay"><div id="card">
  <h1>First-person template</h1>
  <p>Click to capture the mouse.</p>
  <p><kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> sprint</p>
  <p><kbd>Space</kbd> jump &nbsp; <kbd>C</kbd> crouch &nbsp; <kbd>Esc</kbd> release</p>
  <p>Map scale: use the slider (press Esc first) or <kbd>[</kbd> <kbd>]</kbd>.</p>
  <p>Allow location access to texture the ground with the map around you (1 km radius).</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= CONFIG: tweak these ================= */
const CFG = {
  walkSpeed: 5, sprintSpeed: 8.5, crouchSpeed: 2.5,
  groundAccel: 60,   // how fast you reach target speed on ground
  airControl: 0.25,  // fraction of accel while airborne
  jumpSpeed: 7.5, gravity: 22,
  standHeight: 1.8, crouchHeight: 1.1, eyeOffset: 0.15, // eye = top of body - eyeOffset
  radius: 0.35,
  sensitivity: 0.0022, maxPitch: 89 * Math.PI / 180,
  fov: 75, sprintFovBoost: 8,
  bobAmount: 0.05, bobSpeed: 9,
  mapZoom: 17,       // far ground tile zoom (whole radius)
  midZoom: 18, midRadius: 450,    // medium-sharp ring
  nearZoom: 19, nearRadius: 160,  // sharpest patch around the start point
  imagery: 'satellite', // 'satellite' (Esri World Imagery) or 'osm' (street map); ?imagery=osm overrides
  mapRadius: 1000,   // real-world metres of map loaded around you
  mapUnitsPerMetre: 1, // MAP SCALE: real-world metres shown on each 1 m x 1 m floor square. 1 = true scale,
                       // higher = smaller, sharper world (walkable radius = mapRadius / this)
  ratioMin: 0.1, ratioMax: 100,  // slider range
  defaultBuildingHeight: 9,      // metres, when OSM has no height or levels tag
  levelHeight: 3.2               // metres per building:levels
};

/* ================= Scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xcfdbe6), ZENITH = new THREE.Color(0x4f86c6);
scene.background = HORIZON;
scene.fog = new THREE.Fog(HORIZON, 250, 1400);

// Sky dome: zenith-to-horizon gradient plus a soft glow around the sun.
const SUN_DIR = new THREE.Vector3(-0.55, 0.62, -0.56).normalize();   // afternoon sun from the south-west-ish
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: ZENITH }, hor: { value: HORIZON }, sun: { value: SUN_DIR } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); vec4 p = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * p; }',
  fragmentShader: `uniform vec3 top, hor, sun; varying vec3 vD;
    void main(){ float h = max(vD.y, 0.); vec3 c = mix(hor, top, pow(h, .55));
      float s = max(dot(vD, sun), 0.); c += vec3(1., .92, .75) * (pow(s, 900.) * 4. + pow(s, 12.) * .25);
      if (vD.y < 0.) c = hor; gl_FragColor = vec4(c, 1.); }`
}));
sky.renderOrder = -1; scene.add(sky);

scene.add(new THREE.HemisphereLight(0xdde8f5, 0x6b6150, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 1, far: 900 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(CFG.fov, 1, 0.1, 5000);
camera.rotation.order = 'YXZ';   // yaw first, then pitch: no roll

/* ================= World (replace with your level) ================= */
const solids = [], testMeshes = [];               // collision boxes (THREE.Box3)
function addBox(x, y, z, w, h, d, color) { // x,z = center; y = bottom
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m); testMeshes.push(m);
  solids.push(new THREE.Box3().setFromObject(m));
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshLambertMaterial({ color: 0x7d8471 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(200, 100, 0x000000, 0x000000); grid.position.y = 0.01;
grid.material.opacity = 0.12; grid.material.transparent = true; scene.add(grid);
addBox(0, 0, -8, 6, 1, 3, 0xc98f5a);       // low step
addBox(0, 0, -12, 4, 2.2, 3, 0xb9744a);    // high step
addBox(8, 0, -4, 2, 4, 10, 0x8a8fa8);      // wall
addBox(-8, 0, -6, 3, 0.5, 3, 0xd9c36a);
addBox(-8, 0, -10, 3, 1.5, 3, 0xd9a05a);
addBox(-8, 0, -14, 3, 2.5, 3, 0xd97a5a);   // staircase of jumps

/* ================= Player state ================= */
const player = {
  pos: new THREE.Vector3(0, 0, 6),   // feet position
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  height: CFG.standHeight,
  grounded: false, bob: 0, fov: CFG.fov
};

/* ================= Input ================= */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.code] = false; });
addEventListener('blur',    () => { for (const k in keys) keys[k] = false; });

const overlay = document.getElementById('overlay');
let locked = false, dragLook = false;
function look(dx, dy) {
  player.yaw   -= dx * CFG.sensitivity;
  player.pitch  = Math.max(-CFG.maxPitch, Math.min(CFG.maxPitch, player.pitch - dy * CFG.sensitivity));
}
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  startLocation();
  try { renderer.domElement.requestPointerLock(); } catch (e) {}
  setTimeout(() => { if (!locked) dragLook = true; }, 300); // fallback if pointer lock is blocked
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) dragLook = false; else if (!dragLook) overlay.style.display = 'flex';
});
addEventListener('mousemove', e => {
  if (locked) look(e.movementX, e.movementY);
  else if (dragLook && e.buttons && !e.target.closest('#ratio')) look(e.movementX, e.movementY);
});
addEventListener('keydown', e => { if (e.code === 'Escape' && dragLook) { dragLook = false; overlay.style.display = 'flex'; } });

/* ================= Movement + collision ================= */
function overlaps(b) {
  const p = player.pos, r = CFG.radius;
  return p.x + r > b.min.x && p.x - r < b.max.x &&
         p.y + player.height > b.min.y && p.y < b.max.y &&
         p.z + r > b.min.z && p.z - r < b.max.z;
}
// Move one axis at a time, then push out of anything we hit.
function moveAxis(axis, amount) {
  player.pos[axis] += amount;
  for (const b of solids) {
    if (!overlaps(b)) continue;
    if (axis === 'y') {
      if (amount <= 0) { player.pos.y = b.max.y; player.grounded = true; }
      else player.pos.y = b.min.y - player.height;
      player.vel.y = 0;
    } else {
      player.pos[axis] = amount > 0 ? b.min[axis] - CFG.radius : b.max[axis] + CFG.radius;
      player.vel[axis] = 0;
    }
  }
  collideBuildings(axis, amount);
}

function updatePlayer(dt) {
  // crouch (blocked from standing up under a ceiling)
  const wantCrouch = keys.KeyC || keys.ControlLeft;
  const targetH = wantCrouch ? CFG.crouchHeight : CFG.standHeight;
  if (targetH > player.height) {
    const prev = player.height; player.height = targetH;
    if (solids.some(overlaps)) player.height = prev;
  } else player.height = targetH;
  const crouching = player.height < CFG.standHeight - 0.01;

  // wish direction relative to where we're looking
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  let wx = strafe * cos - fwd * sin, wz = -strafe * sin - fwd * cos;
  const len = Math.hypot(wx, wz); if (len > 0) { wx /= len; wz /= len; }

  const sprinting = keys.ShiftLeft && fwd > 0 && !crouching;
  const speed = crouching ? CFG.crouchSpeed : sprinting ? CFG.sprintSpeed : CFG.walkSpeed;
  const accel = CFG.groundAccel * (player.grounded ? 1 : CFG.airControl) * dt;
  const approach = (v, t) => v + Math.max(-accel, Math.min(accel, t - v));
  player.vel.x = approach(player.vel.x, wx * speed);
  player.vel.z = approach(player.vel.z, wz * speed);

  // jump + gravity
  if (keys.Space && player.grounded) player.vel.y = CFG.jumpSpeed;
  player.vel.y -= CFG.gravity * dt;

  // integrate with collision
  player.grounded = false;
  moveAxis('x', player.vel.x * dt);
  moveAxis('z', player.vel.z * dt);
  moveAxis('y', player.vel.y * dt);
  const dist = Math.hypot(player.pos.x, player.pos.z);   // stay inside the mapped circle
  const lim = CFG.mapRadius / mapRatio;
  if (dist > lim) { player.pos.x *= lim / dist; player.pos.z *= lim / dist; }
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.grounded = true; }

  // view effects: head bob + sprint FOV
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (player.grounded) player.bob += hSpeed * dt * CFG.bobSpeed / CFG.walkSpeed;
  const bobY = player.grounded ? Math.sin(player.bob) * CFG.bobAmount * Math.min(hSpeed / CFG.walkSpeed, 1) : 0;
  const targetFov = CFG.fov + (sprinting && hSpeed > 1 ? CFG.sprintFovBoost : 0);
  player.fov += (targetFov - player.fov) * Math.min(1, dt * 8);
  if (Math.abs(camera.fov - player.fov) > 0.01) { camera.fov = player.fov; camera.updateProjectionMatrix(); }

  // camera follows eye position
  camera.position.set(player.pos.x, player.pos.y + player.height - CFG.eyeOffset + bobY, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  document.getElementById('hud').textContent =
    `speed ${hSpeed.toFixed(1)} m/s · ${player.grounded ? 'grounded' : 'airborne'}${crouching ? ' · crouching' : ''}${buildingStatus}`;
}

/* ================= Map ground (OpenStreetMap tiles) =================
   World axes: +x = east, -z = north, 1 unit = 1 metre. The player's real location is (0, 0).
   Test without GPS: add ?lat=43.6426&lon=-79.3871 to the URL. */
/* Map scale: mapGroup is scaled about the origin (your real position), so changing the ratio
   never moves you relative to the map. Floor metre = mapRatio real metres. */
const mapGroup = new THREE.Group(); scene.add(mapGroup);          // ground texture (x/z scaled only)
const bGroup = new THREE.Group(); scene.add(bGroup);              // buildings (scaled uniformly, so heights shrink too)
let mapRatio = CFG.mapUnitsPerMetre;
const rs = document.getElementById('rs'), rv = document.getElementById('rv');
rs.min = Math.log10(CFG.ratioMin); rs.max = Math.log10(CFG.ratioMax); rs.step = 0.01;   // log slider
function setRatio(r) {
  mapRatio = Math.min(CFG.ratioMax, Math.max(CFG.ratioMin, r));
  rs.value = Math.log10(mapRatio);
  mapGroup.scale.set(1 / mapRatio, 1, 1 / mapRatio);           // keep height at 1 to avoid z-fighting
  bGroup.scale.setScalar(1 / mapRatio);
  const f = mapRatio >= 10 ? mapRatio.toFixed(0) : mapRatio.toFixed(1);
  rv.textContent = `1 m × 1 m of floor = ${f} m × ${f} m of map (reach ${Math.round(CFG.mapRadius / mapRatio)} m)`;
}
rs.addEventListener('input', () => setRatio(10 ** rs.value));
rs.addEventListener('change', () => rs.blur());                 // so Space/arrows go back to the game
addEventListener('keydown', e => {
  if (e.code === 'BracketLeft') setRatio(mapRatio / 1.1);
  if (e.code === 'BracketRight') setRatio(mapRatio * 1.1);
});
setRatio(CFG.mapUnitsPerMetre);

/* ================= Buildings (OSM footprints -> oriented boxes) =================
   Each building becomes the smallest rotated rectangle around its footprint, extruded to its
   real height (height tag, else building:levels, else CFG.defaultBuildingHeight).
   Data stored in REAL metres; collision and rendering scale by 1 / mapRatio. */
const OVERPASS_URLS = [                        // tried in order; the main server often answers 429/502/504
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];
const buildings = [];

/* Facade texture: one window bay (3.5 m wide x 3.2 m tall), tiled along every wall.
   The wall is drawn near-white so each building's vertex colour tints it. */
const BAY_W = 3.5, BAY_H = CFG.levelHeight;
function facadeTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f1ec'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) {                               // plaster/brick grain
    const v = 225 + Math.random() * 30 | 0; g.fillStyle = `rgb(${v},${v - 3},${v - 8})`;
    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
  }
  g.fillStyle = '#d9d4cc'; g.fillRect(0, 118, 128, 10);          // floor slab line
  const grd = g.createLinearGradient(0, 22, 0, 98);              // glass: sky reflection at top, dark below
  grd.addColorStop(0, '#8fa6bd'); grd.addColorStop(0.45, '#3c4c5e'); grd.addColorStop(1, '#1d2631');
  g.fillStyle = '#5b5750'; g.fillRect(26, 18, 76, 84);           // frame
  g.fillStyle = grd; g.fillRect(30, 22, 68, 76);
  g.fillStyle = '#5b5750'; g.fillRect(62, 22, 4, 76); g.fillRect(30, 58, 68, 3);   // mullions
  g.fillStyle = '#e6e2da'; g.fillRect(22, 102, 84, 5);           // sill
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.repeat.set(1 / BAY_W, 1 / BAY_H);                            // wall UVs are in metres
  return t;
}
const WALL_TINTS = [0xe8dccb, 0xd9cbb5, 0xc9b9a6, 0xb88d74, 0xa7735c, 0xdcdcdc, 0xbfc4c7, 0xe3d5b8, 0x9e9a94];
const ROOF_TINTS = [0x6f6b66, 0x5d5a57, 0x7c776f, 0x8a8178, 0x575c61, 0x925c48];

// Append one ExtrudeGeometry's triangles to the roof (group 0) / wall (group 1) buffers.
function appendGeo(geo, out, wallCol, roofCol) {
  const pos = geo.attributes.position.array, nor = geo.attributes.normal.array, uv = geo.attributes.uv.array;
  for (const grp of geo.groups) {
    const o = grp.materialIndex === 0 ? out.roof : out.wall, col = grp.materialIndex === 0 ? roofCol : wallCol;
    for (let v = grp.start; v < grp.start + grp.count; v++) {
      o.p.push(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2]);
      o.n.push(nor[v * 3], nor[v * 3 + 1], nor[v * 3 + 2]);
      o.u.push(uv[v * 2], uv[v * 2 + 1]);
      o.c.push(col.r, col.g, col.b);
    }
  }
}
function toMesh(o, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(o.p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(o.n, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(o.u, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(o.c, 3));
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; m.frustumCulled = false;
  return m;
}

function addTrees(pts) {                       // pts: [[x, z], ...] real metres
  if (!pts.length) return;
  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.22, 1, 6); trunkGeo.translate(0, 0.5, 0);
  const crownGeo = new THREE.IcosahedronGeometry(1, 1);
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x5a4332 }), pts.length);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), pts.length);
  const d = new THREE.Object3D(), col = new THREE.Color();
  pts.forEach(([x, z], i) => {
    const r = Math.sin(i * 12.9898) * 43758.5453 % 1, s = 0.75 + Math.abs(r) * 0.6;   // stable per-tree size
    const trunkH = 2.6 * s;
    d.position.set(x, 0, z); d.rotation.set(0, 0, 0); d.scale.set(s, trunkH, s); d.updateMatrix(); trunks.setMatrixAt(i, d.matrix);
    d.position.set(x, trunkH + 1.6 * s, z); d.rotation.set(0, r * 6, 0); d.scale.set(2.6 * s, 2.3 * s, 2.6 * s);
    d.updateMatrix(); crowns.setMatrixAt(i, d.matrix);
    col.setHSL(0.26 + r * 0.04, 0.38, 0.27 + Math.abs(r) * 0.08); crowns.setColorAt(i, col);
  });
  for (const m of [trunks, crowns]) { m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; bGroup.add(m); }
}

async function overpass(q) {
  let err;
  for (const url of OVERPASS_URLS) {
    try {
      const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (res.ok) return await res.json();
      err = new Error('HTTP ' + res.status);
    } catch (e) { err = e; }
  }
  throw err;
}
let buildingStatus = '';

function minRect(pts) {                       // pts: [[x, z], ...] -> {x, z, hx, hz, c, s, ang}
  const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  const H = lo.slice(0, -1).concat(up.slice(0, -1));          // convex hull
  if (H.length < 3) return null;
  let best = null;
  for (let i = 0; i < H.length; i++) {                        // try each hull edge as the box's axis
    const a = H[i], b = H[(i + 1) % H.length], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const c = Math.cos(ang), s = Math.sin(ang);
    let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
    for (const p of H) {
      const u = p[0] * c + p[1] * s, v = -p[0] * s + p[1] * c;
      u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
    }
    const area = (u1 - u0) * (v1 - v0);
    if (!best || area < best.area) best = { area, ang, c, s, u0, u1, v0, v1 };
  }
  const mu = (best.u0 + best.u1) / 2, mv = (best.v0 + best.v1) / 2;
  return { x: mu * best.c - mv * best.s, z: mu * best.s + mv * best.c,
           hx: (best.u1 - best.u0) / 2, hz: (best.v1 - best.v0) / 2, c: best.c, s: best.s, ang: best.ang };
}

function heightOf(t) {
  const h = parseFloat(t.height); if (h > 0) return h;
  const l = parseFloat(t['building:levels']); if (l > 0) return l * CFG.levelHeight;
  return CFG.defaultBuildingHeight;
}

async function loadBuildings(lat, lon) {
  buildingStatus = ' · loading buildings…';
  try {
    const R = CFG.mapRadius;
    const q = `[out:json][timeout:40];(way["building"](around:${R},${lat},${lon});node["natural"="tree"](around:${R},${lat},${lon}););out tags geom;`;
    const data = await overpass(q);
    const kx = 111320 * Math.cos(lat * Math.PI / 180), kz = 111132;   // metres per degree
    const list = [], trees = [];
    const out = { roof: { p: [], n: [], u: [], c: [] }, wall: { p: [], n: [], u: [], c: [] } };
    const wallCol = new THREE.Color(), roofCol = new THREE.Color();
    for (const w of data.elements) {
      if (w.type === 'node') { trees.push([(w.lon - lon) * kx, -(w.lat - lat) * kz]); continue; }
      if (!w.geometry || w.geometry.length < 4) continue;
      const pts = w.geometry.map(g => [(g.lon - lon) * kx, -(g.lat - lat) * kz]);   // -z = north
      const r = minRect(pts);                                    // rotated box: used for collision only
      if (!r || Math.hypot(r.x, r.z) > R) continue;
      r.hx = Math.max(r.hx, 0.75); r.hz = Math.max(r.hz, 0.75);
      r.h = heightOf(w.tags || {}); r.r = Math.hypot(r.hx, r.hz);
      list.push(r);

      // Render the real footprint: extrude the polygon up to the building's height.
      const ring = pts.slice(0, -1);                             // OSM rings repeat the first node at the end
      const shape = new THREE.Shape(ring.map(([x, z]) => new THREE.Vector2(x, -z)));
      let geo;
      try { geo = new THREE.ExtrudeGeometry(shape, { depth: r.h, bevelEnabled: false }); } catch (e) { continue; }
      geo.rotateX(-Math.PI / 2);                                 // shape plane -> ground, extrusion -> up
      const i = list.length, t = w.tags || {};
      wallCol.set(t['building:colour'] || WALL_TINTS[(i * 7) % WALL_TINTS.length]);
      roofCol.set(t['roof:colour'] || ROOF_TINTS[(i * 5) % ROOF_TINTS.length]);
      appendGeo(geo, out, wallCol, roofCol);
      geo.dispose();
    }
    if (!list.length) { buildingStatus = ' · no buildings found'; addTrees(trees); return; }

    bGroup.add(toMesh(out.wall, new THREE.MeshLambertMaterial({ map: facadeTexture(), vertexColors: true })));
    bGroup.add(toMesh(out.roof, new THREE.MeshLambertMaterial({ vertexColors: true })));
    addTrees(trees);
    buildings.push(...list);
    testMeshes.forEach(m => scene.remove(m)); testMeshes.length = 0; solids.length = 0;   // drop the demo blocks
    buildingStatus = ` · ${list.length} buildings · ${trees.length} trees`;
  } catch (e) { buildingStatus = ' · buildings failed (' + e.message + ')'; }
}

// Circle (player) vs rotated box. Walk into the sides; land on and walk across the roof.
function collideBuildings(axis, amount) {
  const k = 1 / mapRatio, p = player.pos, rad = CFG.radius;
  for (const b of buildings) {
    const bx = b.x * k, bz = b.z * k, top = b.h * k, R = b.r * k + rad;
    if (Math.abs(p.x - bx) > R || Math.abs(p.z - bz) > R || p.y >= top) continue;
    const dx = p.x - bx, dz = p.z - bz, hx = b.hx * k, hz = b.hz * k;
    const lx = dx * b.c + dz * b.s, lz = -dx * b.s + dz * b.c;           // player in box space
    const ex = lx - Math.max(-hx, Math.min(hx, lx)), ez = lz - Math.max(-hz, Math.min(hz, lz));
    const d2 = ex * ex + ez * ez;
    if (d2 >= rad * rad) continue;
    if (axis === 'y') { if (amount <= 0) { p.y = top; player.vel.y = 0; player.grounded = true; } continue; }
    let px, pz;                                                           // push-out in box space
    if (d2 > 1e-9) { const dd = Math.sqrt(d2); px = ex / dd * (rad - dd); pz = ez / dd * (rad - dd); }
    else if (hx - Math.abs(lx) < hz - Math.abs(lz)) { px = Math.sign(lx || 1) * (hx - Math.abs(lx) + rad); pz = 0; }
    else { px = 0; pz = Math.sign(lz || 1) * (hz - Math.abs(lz) + rad); }
    const wx = px * b.c - pz * b.s, wz = px * b.s + pz * b.c, m = Math.hypot(wx, wz) || 1;
    p.x += wx; p.z += wz;
    const vn = (player.vel.x * wx + player.vel.z * wz) / m;               // cancel velocity into the wall
    if (vn < 0) { player.vel.x -= wx / m * vn; player.vel.z -= wz / m * vn; }
  }
}

const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const credit = document.getElementById('credit');
let locStarted = false;

function startLocation() {
  if (locStarted) return; locStarted = true;
  const q = new URLSearchParams(location.search);
  if (q.has('lat') && q.has('lon')) return loadMap(+q.get('lat'), +q.get('lon'));
  if (!navigator.geolocation) { credit.textContent = 'Location not supported: using flat ground'; return; }
  credit.textContent = 'Getting location…';
  navigator.geolocation.getCurrentPosition(
    p => loadMap(p.coords.latitude, p.coords.longitude),
    e => { credit.textContent = 'Location unavailable (' + e.message + '): using flat ground'; },
    { enableHighAccuracy: true, timeout: 15000 });
}

const loadImage = url => new Promise(res => {
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => res(img); img.onerror = () => res(null); img.src = url;
});

const TILES = {
  satellite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZ: 19,
    credit: 'Imagery © Esri, Maxar, Earthstar Geographics' },
  osm: { url: TILE_URL, maxZ: 19, credit: '' }
};

/* Ground detail: a tileable grain multiplied over the imagery, fading out with distance,
   so the ground doesn't look like a smeared photo at eye level. */
const detailTex = (() => {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  for (const [cells, amp, alpha] of [[16, 120, 1], [64, 90, 0.6], [256, 60, 0.35]]) {   // blotches -> grit
    const n = document.createElement('canvas'); n.width = n.height = cells;
    const ng = n.getContext('2d'), img = ng.createImageData(cells, cells);
    for (let i = 0; i < cells * cells; i++) {
      const v = 128 + (Math.random() - 0.5) * amp | 0;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    ng.putImageData(img, 0, 0);
    g.globalAlpha = alpha; g.imageSmoothingEnabled = true;
    g.drawImage(n, 0, 0, S, S);
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 260; i++) {                                // pebbles / cracks / stains
    const v = 90 + Math.random() * 80 | 0; g.fillStyle = `rgba(${v},${v},${v},0.35)`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 0.6 + Math.random() * 3.5, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
})();
function addGroundDetail(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.detailMap = { value: detailTex };
    sh.vertexShader = 'varying vec2 vDetUv; varying float vDetDist;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vDetUv = (modelMatrix * vec4(transformed, 1.)).xz * 0.2; vDetDist = -mvPosition.z;');
    sh.fragmentShader = 'uniform sampler2D detailMap; varying vec2 vDetUv; varying float vDetDist;\n' + sh.fragmentShader.replace('#include <map_fragment>',
      `#include <map_fragment>
       float dA = texture2D(detailMap, vDetUv).r, dB = texture2D(detailMap, vDetUv * 0.13).r;
       float fade = 1. - smoothstep(25., 140., vDetDist);
       diffuseColor.rgb *= mix(1., (0.45 + dA * 1.1) * (0.75 + dB * 0.5), fade);`);
  };
  return mat;
}
addGroundDetail(floor.material);

// Build one ground layer: a mosaic of tiles covering `radius` real metres around (lat, lon).
async function loadLayer(src, lat, lon, zoom, radius, y) {
  const rad = lat * Math.PI / 180, maxTex = Math.min(renderer.capabilities.maxTextureSize, 8192);
  let z = Math.min(zoom, src.maxZ), n, mpp, cx, cy, x0, x1, y0, y1, cols, rows;
  for (;; z--) {                                                 // lower the zoom until the mosaic fits in one texture
    n = 2 ** z;
    mpp = 156543.03392 * Math.cos(rad) / n;                      // real metres per source pixel
    cx = (lon + 180) / 360 * n;                                  // fractional tile coords of the player
    cy = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
    const rt = radius / (mpp * 256);                             // radius in tiles
    x0 = Math.floor(cx - rt); x1 = Math.floor(cx + rt);
    y0 = Math.max(0, Math.floor(cy - rt)); y1 = Math.min(n - 1, Math.floor(cy + rt));
    cols = x1 - x0 + 1; rows = y1 - y0 + 1;
    if (Math.max(cols, rows) * 256 <= maxTex || z <= 12) break;
  }
  const canvas = document.createElement('canvas');
  canvas.width = cols * 256; canvas.height = rows * 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#8a8a80'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const jobs = [];
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const url = src.url.replace('{z}', z).replace('{x}', ((tx % n) + n) % n).replace('{y}', ty);
    jobs.push(loadImage(url).then(img => { if (img) ctx.drawImage(img, (tx - x0) * 256, (ty - y0) * 256); return !!img; }));
  }
  const ok = (await Promise.all(jobs)).filter(Boolean).length;
  if (!ok) return false;

  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mat = addGroundDetail(new THREE.MeshLambertMaterial({ map: tex, polygonOffset: true, polygonOffsetFactor: -y * 50, polygonOffsetUnits: -y * 50 }));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(canvas.width * mpp, canvas.height * mpp), mat);
  ground.rotation.x = -Math.PI / 2;                              // texture top = north = -z
  ground.position.set((canvas.width / 2 - (cx - x0) * 256) * mpp, y, (canvas.height / 2 - (cy - y0) * 256) * mpp);
  ground.receiveShadow = true;
  mapGroup.add(ground);
  return true;
}

async function loadMap(lat, lon) {
  loadBuildings(lat, lon);                                       // runs in parallel with the tiles
  const pick = new URLSearchParams(location.search).get('imagery') || CFG.imagery;
  let src = TILES[pick] || TILES.satellite;
  credit.textContent = 'Loading ground imagery…';
  let ok = await loadLayer(src, lat, lon, CFG.mapZoom, CFG.mapRadius, 0.02);
  if (!ok && src !== TILES.osm) { src = TILES.osm; ok = await loadLayer(src, lat, lon, CFG.mapZoom, CFG.mapRadius, 0.02); }
  if (!ok) { credit.textContent = 'Map tiles blocked or offline: using flat ground'; return; }
  grid.visible = false;
  testMeshes.forEach(m => scene.remove(m)); testMeshes.length = 0; solids.length = 0;   // drop the demo blocks
  loadLayer(src, lat, lon, CFG.midZoom, CFG.midRadius, 0.03)       // sharper rings near the start point
    .then(() => loadLayer(src, lat, lon, CFG.nearZoom, CFG.nearRadius, 0.04));
  credit.innerHTML = `${lat.toFixed(4)}, ${lon.toFixed(4)} · ${src.credit ? src.credit + ' · ' : ''}© <a style="color:inherit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors`;
  credit.style.pointerEvents = 'auto';
}

/* ================= Loop ================= */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now();
(function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.1); last = now;
  const steps = Math.ceil(dt / 0.016);          // substeps keep collisions stable on slow frames
  for (let i = 0; i < steps; i++) updatePlayer(dt / steps);
  // keep the sky and the sun's shadow box centred on the player
  sky.position.copy(camera.position);
  sun.target.position.set(Math.round(camera.position.x), 0, Math.round(camera.position.z));
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 400);
  renderer.render(scene, camera);
})(last);
</script>
</body>
