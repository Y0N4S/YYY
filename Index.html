<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps Clone</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Three.js for 3D Walk Environment & BufferGeometryUtils -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    body { font-family: 'Roboto', sans-serif; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="overflow-hidden bg-slate-900 text-slate-800">

  <!-- Top Floating Search & Category Bar -->
  <div class="absolute top-4 left-4 right-4 md:left-6 md:right-auto md:w-[480px] z-[1000] flex flex-col gap-3 pointer-events-none">
    <div class="flex items-center bg-white shadow-lg rounded-full px-4 py-2 pointer-events-auto border border-slate-200">
      <button id="menu-btn" class="text-slate-600 hover:text-slate-900 mr-3 text-lg"><i class="fa-solid fa-bars"></i></button>
      <input id="search-input" type="text" placeholder="Search Google Maps or address..." class="w-full bg-transparent outline-none text-slate-800 text-sm md:text-base pr-2">
      <button id="search-btn" class="text-slate-500 hover:text-blue-600 px-2"><i class="fa-solid fa-magnifying-glass"></i></button>
      <div class="h-6 w-[1px] bg-slate-300 mx-2"></div>
      <button id="directions-trigger-btn" class="text-blue-600 hover:text-blue-700 px-2" title="Directions"><i class="fa-solid fa-diamond-turn-right text-lg"></i></button>
    </div>

    <!-- Category Chips -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 pointer-events-auto custom-scrollbar no-scrollbar">
      <button onclick="searchCategory('restaurant')" class="flex items-center gap-2 bg-white hover:bg-slate-50 shadow-md px-4 py-2 rounded-full text-xs font-medium text-slate-700 whitespace-nowrap border border-slate-100 transition"><i class="fa-solid fa-utensils text-red-500"></i> Restaurants</button>
      <button onclick="searchCategory('cafe')" class="flex items-center gap-2 bg-white hover:bg-slate-50 shadow-md px-4 py-2 rounded-full text-xs font-medium text-slate-700 whitespace-nowrap border border-slate-100 transition"><i class="fa-solid fa-mug-hot text-amber-600"></i> Coffee</button>
      <button onclick="searchCategory('hotel')" class="flex items-center gap-2 bg-white hover:bg-slate-50 shadow-md px-4 py-2 rounded-full text-xs font-medium text-slate-700 whitespace-nowrap border border-slate-100 transition"><i class="fa-solid fa-hotel text-blue-500"></i> Hotels</button>
      <button onclick="searchCategory('park')" class="flex items-center gap-2 bg-white hover:bg-slate-50 shadow-md px-4 py-2 rounded-full text-xs font-medium text-slate-700 whitespace-nowrap border border-slate-100 transition"><i class="fa-solid fa-tree text-green-600"></i> Parks</button>
      <button onclick="searchCategory('transit')" class="flex items-center gap-2 bg-white hover:bg-slate-50 shadow-md px-4 py-2 rounded-full text-xs font-medium text-slate-700 whitespace-nowrap border border-slate-100 transition"><i class="fa-solid fa-train text-purple-600"></i> Transit</button>
    </div>
  </div>

  <!-- Autocomplete Results Dropdown -->
  <div id="autocomplete-results" class="absolute top-20 left-4 md:left-6 md:w-[480px] bg-white shadow-xl rounded-2xl z-[1000] hidden overflow-hidden border border-slate-200"></div>

  <!-- Left Sliding Drawer for Place Details / Directions -->
  <div id="left-drawer" class="absolute top-0 left-0 w-full md:w-[420px] h-full bg-white shadow-2xl z-[1001] transform -translate-x-full transition-transform duration-300 flex flex-col">
    <!-- Drawer Header -->
    <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
      <div class="flex items-center gap-3">
        <button id="close-drawer" class="text-slate-500 hover:text-slate-800 text-lg w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 id="drawer-title" class="font-bold text-slate-800 text-lg">Location Details</h2>
      </div>
      <button id="close-drawer-x" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <!-- Drawer Body -->
    <div id="drawer-content" class="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-4">
      <!-- Dynamically populated place details or directions panel -->
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Bottom-Right Floating Controls (Layers, GPS, 3D Walk) -->
  <div class="absolute bottom-8 right-4 md:right-8 z-[1000] flex flex-col gap-3">
    <!-- 3D Walk Mode Trigger Button -->
    <button onclick="open3DWalkEnvironment()" class="bg-blue-600 hover:bg-blue-700 text-white shadow-lg w-12 h-12 rounded-2xl flex items-center justify-center text-xl transition transform hover:scale-105" title="Enter 3D Walk Mode (50m Radius)"><i class="fa-solid fa-vr-cardboard"></i></button>
    <!-- Layers Picker -->
    <div class="relative">
      <button id="layers-btn" class="bg-white hover:bg-slate-50 text-slate-700 shadow-lg w-12 h-12 rounded-2xl flex items-center justify-center text-lg border border-slate-200 transition"><i class="fa-solid fa-layer-group"></i></button>
      <div id="layers-menu" class="absolute bottom-14 right-0 bg-white shadow-xl rounded-2xl p-3 hidden w-48 border border-slate-200 space-y-2">
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-2">Map Type</div>
        <button onclick="setMapLayer('default')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-map text-blue-500"></i> Default</button>
        <button onclick="setMapLayer('satellite')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-earth-americas text-green-600"></i> Satellite</button>
        <button onclick="setMapLayer('terrain')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-mountain text-amber-600"></i> Terrain</button>
        <button onclick="setMapLayer('dark')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-moon text-indigo-600"></i> Dark Mode</button>
        <div class="border-t border-slate-100 pt-2">
          <label class="flex items-center gap-2 px-2 text-sm font-medium text-slate-700 cursor-pointer">
            <input type="checkbox" id="transit-toggle" onchange="toggleTransit(this.checked)" class="rounded text-blue-600 focus:ring-blue-500"> Transit Overlays
          </label>
        </div>
      </div>
    </div>
    <!-- GPS Locate Me Button -->
    <button id="locate-btn" class="bg-white hover:bg-slate-50 text-slate-700 shadow-lg w-12 h-12 rounded-2xl flex items-center justify-center text-lg border border-slate-200 transition" title="Locate Me"><i class="fa-solid fa-location-crosshairs text-blue-600"></i></button>
  </div>

  <!-- 3D Walk Environment Modal -->
  <div id="modal-3d" class="fixed inset-0 z-[2000] bg-slate-950/90 hidden flex flex-col">
    <!-- 3D Top Header Bar -->
    <div class="flex items-center justify-between px-6 py-4 bg-slate-900 border-b border-slate-800 text-white">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
        <div>
          <h2 class="font-bold text-lg">3D Walk Mode <span class="text-xs bg-blue-600 px-2 py-0.5 rounded-full ml-2">50m Radius</span></h2>
          <p class="text-xs text-slate-400">Procedural 3D reconstruction around your GPS location</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center gap-2 text-xs text-slate-300 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <span><kbd class="bg-slate-700 px-1.5 py-0.5 rounded">W A S D</kbd> / <kbd class="bg-slate-700 px-1.5 py-0.5 rounded">Arrows</kbd> to Move</span>
          <span class="mx-2">|</span>
          <span><kbd class="bg-slate-700 px-1.5 py-0.5 rounded">Mouse Drag</kbd> to Look</span>
        </div>
        <button onclick="close3DWalkEnvironment()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition border border-slate-700"><i class="fa-solid fa-xmark mr-2"></i> Exit 3D</button>
      </div>
    </div>
    <!-- Canvas Container -->
    <div id="canvas-container" class="flex-1 relative cursor-grab active:cursor-grabbing">
      <!-- Crosshair -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-2 h-2 rounded-full bg-white/60 border border-slate-900 shadow"></div>
      </div>
      <!-- Controls HUD for Mobile / Touch -->
      <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 md:hidden flex gap-3 z-10">
        <button id="btn-forward" class="bg-white/20 backdrop-blur text-white px-4 py-3 rounded-xl font-bold text-lg active:bg-white/40"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white px-5 py-3 rounded-2xl shadow-2xl z-[3000] hidden text-sm font-medium transition-all"></div>

  <!-- JavaScript Application Logic -->
  <script>
    let map, userLat = 43.6532, userLon = -79.3832; // Default Toronto center
    let baseLayers = {}, currentLayerKey = 'default', transitLayer = null;
    let markersLayer = L.layerGroup(), routeLayer = L.layerGroup();
    let selectedPlace = null;
    let threeApp = null; // Holds 3D scene cleanup handler

    // Initialize Map on Load
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
      getUserLocation(true);
    });

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), duration);
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([userLat, userLon], 14);

      // Define Esri keyless tile layers
      baseLayers.default = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri', maxZoom: 19
      });
      baseLayers.satellite = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { attribution: 'Labels &copy; Esri', maxZoom: 19, opacity: 0.9 })
      ]);
      baseLayers.terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri', maxZoom: 19
      });
      baseLayers.dark = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 16 }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { attribution: 'Labels &copy; Esri', maxZoom: 16 })
      ]);

      baseLayers.default.addTo(map);
      markersLayer.addTo(map);
      routeLayer.addTo(map);

      // Add Zoom Control to Bottom Right
      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    function setMapLayer(key) {
      if (baseLayers[currentLayerKey]) map.removeLayer(baseLayers[currentLayerKey]);
      currentLayerKey = key;
      if (baseLayers[key]) baseLayers[key].addTo(map);
      document.getElementById('layers-menu').classList.add('hidden');
      showToast(`Switched to ${key} map`);
    }

    function toggleTransit(enabled) {
      if (enabled) {
        transitLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Transportation &copy; Esri', opacity: 0.8, maxZoom: 19
        });
        transitLayer.addTo(map);
        showToast('Transit layer enabled');
      } else if (transitLayer) {
        map.removeLayer(transitLayer);
        transitLayer = null;
        showToast('Transit layer disabled');
      }
    }

    function setupEventListeners() {
      document.getElementById('layers-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const menu = document.getElementById('layers-menu');
        menu.classList.toggle('hidden');
      });

      document.addEventListener('click', () => {
        document.getElementById('layers-menu').classList.add('hidden');
        document.getElementById('autocomplete-results').classList.add('hidden');
      });

      document.getElementById('locate-btn').addEventListener('click', () => getUserLocation(false));

      document.getElementById('close-drawer').addEventListener('click', closeDrawer);
      document.getElementById('close-drawer-x').addEventListener('click', closeDrawer);

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', debounce(async (e) => {
        const query = e.target.value.trim();
        if (query.length < 2) {
          document.getElementById('autocomplete-results').classList.add('hidden');
          return;
        }
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
          const data = await res.json();
          renderAutocomplete(data);
        } catch (err) {
          console.error(err);
        }
      }, 300));

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          performSearch(searchInput.value);
          document.getElementById('autocomplete-results').classList.add('hidden');
        }
      });

      document.getElementById('search-btn').addEventListener('click', () => {
        performSearch(searchInput.value);
        document.getElementById('autocomplete-results').classList.add('hidden');
      });
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function getUserLocation(initial = false) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          map.setView([userLat, userLon], 15);
          
          // Add User Marker
          L.marker([userLat, userLon], {
            icon: L.divIcon({
              className: 'custom-user-pin',
              html: '<div class="w-6 h-6 bg-blue-600 rounded-full border-4 border-white shadow-lg animate-pulse"></div>',
              iconSize: [24, 24],
              iconAnchor: [12, 12]
            })
          }).addTo(map).bindPopup('<b>You are here</b>');

          if (!initial) showToast('Centered on your device location');
        }, (err) => {
          console.warn('Geolocation denied or unavailable:', err);
          if (!initial) showToast('Could not fetch device location. Using default.');
        }, { enableHighAccuracy: true });
      }
    }

    async function performSearch(query) {
      if (!query) return;
      showToast(`Searching for "${query}"...`);
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=10`);
        const data = await res.json();
        if (data && data.length > 0) {
          markersLayer.clearLayers();
          const first = data[0];
          const lat = parseFloat(first.lat);
          const lon = parseFloat(first.lon);
          map.setView([lat, lon], 15);

          data.forEach(item => {
            const mLat = parseFloat(item.lat);
            const mLon = parseFloat(item.lon);
            const marker = L.marker([mLat, mLon]).addTo(markersLayer);
            marker.on('click', () => selectPlaceDetails({
              name: item.display_name.split(',')[0],
              address: item.display_name,
              lat: mLat,
              lon: mLon,
              type: item.type || 'Location'
            }));
          });

          selectPlaceDetails({
            name: first.display_name.split(',')[0],
            address: first.display_name,
            lat,
            lon,
            type: first.type || 'Location'
          });
        } else {
          showToast('No locations found');
        }
      } catch (err) {
        console.error(err);
        showToast('Search failed');
      }
    }

    function renderAutocomplete(results) {
      const container = document.getElementById('autocomplete-results');
      if (!results || results.length === 0) {
        container.classList.add('hidden');
        return;
      }
      container.innerHTML = results.map(item => `
        <div class="px-4 py-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-none flex items-center gap-3 text-sm text-slate-700" onclick="selectAutocompleteItem(${item.lat}, ${item.lon}, '${encodeURIComponent(item.display_name)}')">
          <i class="fa-solid fa-location-dot text-slate-400"></i>
          <span class="truncate">${item.display_name}</span>
        </div>
      `).join('');
      container.classList.remove('hidden');
    }

    function selectAutocompleteItem(lat, lon, encodedName) {
      const name = decodeURIComponent(encodedName);
      document.getElementById('search-input').value = name;
      document.getElementById('autocomplete-results').classList.add('hidden');
      map.setView([lat, lon], 16);
      markersLayer.clearLayers();
      L.marker([lat, lon]).addTo(markersLayer);
      selectPlaceDetails({ name: name.split(',')[0], address: name, lat, lon, type: 'Selected Place' });
    }

    async function searchCategory(category) {
      showToast(`Searching nearby ${category}s...`);
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${category}&bounded=1&viewbox=${userLon-0.05},${userLat+0.05},${userLon+0.05},${userLat-0.05}&limit=12`);
        const data = await res.json();
        markersLayer.clearLayers();
        if (data && data.length > 0) {
          const group = [];
          data.forEach(item => {
            const lat = parseFloat(item.lat);
            const lon = parseFloat(item.lon);
            const marker = L.marker([lat, lon]).addTo(markersLayer);
            group.push([lat, lon]);
            marker.on('click', () => selectPlaceDetails({
              name: item.display_name.split(',')[0],
              address: item.display_name,
              lat, lon, type: category
            }));
          });
          map.fitBounds(L.latLngBounds(group), { padding: [50, 50] });
          showToast(`Found ${data.length} ${category}s nearby`);
        } else {
          showToast(`No ${category}s found nearby`);
        }
      } catch (err) {
        console.error(err);
        showToast('Category search failed');
      }
    }

    function selectPlaceDetails(place) {
      selectedPlace = place;
      const drawer = document.getElementById('left-drawer');
      const content = document.getElementById('drawer-content');
      document.getElementById('drawer-title').textContent = place.name;

      content.innerHTML = `
        <div class="space-y-4">
          <div class="h-48 rounded-2xl overflow-hidden shadow bg-slate-100 relative">
            <img src="https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(place.name)}" alt="${place.name}" class="w-full h-full object-cover">
            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur text-white text-xs px-3 py-1 rounded-full font-medium">⭐ 4.6 (128 reviews)</div>
          </div>
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">${place.type}</span>
            <h1 class="text-xl font-bold text-slate-800 mt-2">${place.name}</h1>
            <p class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-location-dot text-red-500 mr-2"></i>${place.address}</p>
          </div>
          <div class="flex gap-3 pt-2">
            <button onclick="calculateDirections(${place.lat}, ${place.lon})" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-500/25 transition"><i class="fa-solid fa-diamond-turn-right"></i> Directions</button>
            <button onclick="saveFavoritePlace()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-3 rounded-xl font-medium text-sm transition"><i class="fa-regular fa-bookmark"></i></button>
          </div>
          <div class="border-t border-slate-100 pt-4 space-y-3">
            <div class="flex items-center gap-3 text-sm text-slate-600"><i class="fa-solid fa-clock text-slate-400 w-5"></i> Open ⋅ Closes 10:00 PM</div>
            <div class="flex items-center gap-3 text-sm text-slate-600"><i class="fa-solid fa-phone text-slate-400 w-5"></i> +1 (555) 019-2834</div>
            <div class="flex items-center gap-3 text-sm text-slate-600"><i class="fa-solid fa-globe text-slate-400 w-5"></i> https://www.openstreetmap.org</div>
          </div>
        </div>
      `;
      drawer.classList.remove('-translate-x-full');
    }

    function closeDrawer() {
      document.getElementById('left-drawer').classList.add('-translate-x-full');
    }

    function saveFavoritePlace() {
      if (!selectedPlace) return;
      const saved = JSON.parse(localStorage.getItem('saved_places') || '[]');
      saved.push(selectedPlace);
      localStorage.setItem('saved_places', JSON.stringify(saved));
      showToast('Saved to your places!');
    }

    async function calculateDirections(destLat, destLon) {
      showToast('Calculating route...');
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
          routeLayer.clearLayers();
          L.polyline(coords, { color: '#2563eb', weight: 5, opacity: 0.8 }).addTo(routeLayer);
          map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });

          const distanceKm = (route.distance / 1000).toFixed(1);
          const durationMins = Math.round(route.duration / 60);

          const content = document.getElementById('drawer-content');
          content.innerHTML = `
            <div class="space-y-4">
              <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex items-center justify-between">
                <div>
                  <div class="text-xs font-bold text-blue-600 uppercase">Driving Route</div>
                  <div class="text-2xl font-bold text-slate-800 mt-1">${durationMins} min <span class="text-sm font-normal text-slate-500">(${distanceKm} km)</span></div>
                </div>
                <button onclick="selectPlaceDetails(selectedPlace)" class="text-xs text-blue-600 font-medium hover:underline">Back to Info</button>
              </div>
              <div class="space-y-2">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Turn-by-turn directions</div>
                ${route.legs[0].steps.map((step, idx) => `
                  <div class="flex items-start gap-3 p-3 bg-slate-50 rounded-xl text-sm text-slate-700">
                    <span class="bg-slate-200 text-slate-700 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0">${idx+1}</span>
                    <div class="flex-1">${step.maneuver.instruction || 'Continue straight'} (${Math.round(step.distance)}m)</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        showToast('Could not calculate route');
      }
    }

    // ==========================================
    // 3D WALK ENVIRONMENT (50m Radius Limit)
    // ==========================================
    function open3DWalkEnvironment() {
      document.getElementById('modal-3d').classList.remove('hidden');
      initThreeEnvironment();
    }

    function close3DWalkEnvironment() {
      if (threeApp && threeApp.cleanup) {
        threeApp.cleanup();
        threeApp = null;
      }
      document.getElementById('modal-3d').classList.add('hidden');
    }

    function initThreeEnvironment() {
      const container = document.getElementById('canvas-container');
      container.innerHTML = `
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="w-2 h-2 rounded-full bg-white/60 border border-slate-900 shadow"></div>
        </div>
        <div id="loading-3d" class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur text-white px-4 py-2 rounded-xl text-xs font-medium z-10 border border-slate-700 flex items-center gap-2">
          <div class="w-3 h-3 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <span>Streaming live OSM data (50m radius)...</span>
        </div>
      `;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 1. Data Projection & Origin Setup (Local ENU Cartesian Space)
      // Anchor origin at current player GPS location (userLat, userLon)
      const originLat = userLat;
      const originLon = userLon;
      const latRad = originLat * (Math.PI / 180);
      const metersPerLat = 111132.92 - 559.82 * Math.cos(2 * latRad) + 1.175 * Math.cos(4 * latRad);
      const metersPerLon = 111412.84 * Math.cos(latRad) - 93.5 * Math.cos(3 * latRad);

      function latLonToLocal(lat, lon) {
        const dLat = lat - originLat;
        const dLon = lon - originLon;
        // North/South maps to -z, East/West maps to +x
        const x = dLon * metersPerLon;
        const z = -dLat * metersPerLat;
        return { x, z };
      }

      // Ground plane
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      let dynamicCityGroup = new THREE.Group();
      scene.add(dynamicCityGroup);

      // Fetch live Overpass OSM Data within 50m radius of anchor origin
      async function fetchAndBuildOSMData() {
        const bboxDelta = 0.0006; // Approx 60-70m bounding box
        const s = originLat - bboxDelta;
        const n = originLat + bboxDelta;
        const w = originLon - bboxDelta;
        const e = originLon + bboxDelta;

        const query = `[out:json][timeout:5];(way["highway"](${s},${w},${n},${e});way["building"](${s},${w},${n},${e}););out body;>;out skel qt;`;
        
        try {
          const res = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST',
            body: query
          });
          const osm = await res.json();
          buildCityGeometry(osm);
          const loaderEl = document.getElementById('loading-3d');
          if (loaderEl) loaderEl.remove();
        } catch (err) {
          console.warn('Overpass OSM fetch failed, falling back to procedural generation:', err);
          buildFallbackProceduralCity();
          const loaderEl = document.getElementById('loading-3d');
          if (loaderEl) loaderEl.remove();
        }
      }

      function buildCityGeometry(osmData) {
        const nodes = new Map();
        osmData.elements.forEach(el => {
          if (el.type === 'node') {
            nodes.set(el.id, latLonToLocal(el.lat, el.lon));
          }
        });

        const roadGeometries = [];
        const buildingGeometries = [];

        osmData.elements.forEach(el => {
          if (el.type === 'way' && el.nodes && el.nodes.length >= 2) {
            const wayCoords = el.nodes.map(id => nodes.get(id)).filter(c => c !== undefined);
            if (wayCoords.length < 2) return;

            // 2. Road Network Pipeline (Linestrings to 3D Ribbons)
            if (el.tags && el.tags.highway) {
              const hType = el.tags.highway;
              let width = 6; // default residential
              if (['motorway', 'trunk'].includes(hType)) width = 16;
              else if (['primary', 'secondary'].includes(hType)) width = 10;
              else if (['footway', 'path', 'pedestrian'].includes(hType)) width = 2;

              for (let i = 0; i < wayCoords.length - 1; i++) {
                const p1 = wayCoords[i];
                const p2 = wayCoords[i+1];
                const dx = p2.x - p1.x;
                const dz = p2.z - p1.z;
                const len = Math.sqrt(dx*dx + dz*dz);
                if (len === 0) continue;

                const segGeo = new THREE.PlaneGeometry(width, len);
                segGeo.rotateX(-Math.PI / 2);
                segGeo.translate(0, 0.05, 0); // slight offset to prevent z-fighting

                // Position and rotate segment between p1 and p2
                const midX = (p1.x + p2.x) / 2;
                const midZ = (p1.z + p2.z) / 2;
                segGeo.translate(midX, 0, midZ);
                const angle = Math.atan2(dx, dz);
                segGeo.rotateY(angle);

                roadGeometries.push(segGeo);
              }
            }

            // 3. Building Extrusion Pipeline (Polygons to 3D Structures)
            if (el.tags && el.tags.building) {
              // Cascading height fallback hierarchy
              let height = 15; // default height
              if (el.tags.height) {
                const parsed = parseFloat(el.tags.height);
                if (!isNaN(parsed)) height = parsed;
              } else if (el.tags['building:levels']) {
                const levels = parseInt(el.tags['building:levels'], 10);
                if (!isNaN(levels)) height = levels * 3.5;
              } else if (el.tags.building === 'apartments' || el.tags.building === 'commercial') {
                height = 25;
              }

              // Build THREE.Shape from polygon nodes
              const shapePoints = wayCoords.map(c => new THREE.Vector2(c.x, c.z));
              // Ensure closed loop
              if (wayCoords[0].x !== wayCoords[wayCoords.length-1].x || wayCoords[0].z !== wayCoords[wayCoords.length-1].z) {
                shapePoints.push(new THREE.Vector2(wayCoords[0].x, wayCoords[0].z));
              }

              try {
                const shape = new THREE.Shape(shapePoints);
                const extrudeSettings = {
                  depth: height,
                  bevelEnabled: true,
                  bevelSegments: 2,
                  steps: 1,
                  bevelSize: 0.2,
                  bevelThickness: 0.2
                };
                const bGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                bGeo.rotateX(-Math.PI / 2); // align vertical y-axis
                buildingGeometries.push(bGeo);
              } catch (e) {
                // Ignore invalid non-planar shapes
              }
            }
          }
        });

        // 4. Performance Optimization: Batch geometries using BufferGeometryUtils
        if (roadGeometries.length > 0) {
          const mergedRoads = BufferGeometryUtils.mergeBufferGeometries(roadGeometries);
          const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
          dynamicCityGroup.add(new THREE.Mesh(mergedRoads, roadMat));
        }

        if (buildingGeometries.length > 0) {
          const mergedBuildings = BufferGeometryUtils.mergeBufferGeometries(buildingGeometries);
          const bMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.3 });
          const bMesh = new THREE.Mesh(mergedBuildings, bMat);
          bMesh.castShadow = true;
          bMesh.receiveShadow = true;
          dynamicCityGroup.add(bMesh);
        } else {
          buildFallbackProceduralCity();
        }
      }

      function buildFallbackProceduralCity() {
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const roadH = new THREE.Mesh(new THREE.PlaneGeometry(100, 8), roadMat);
        roadH.rotation.x = -Math.PI / 2;
        roadH.position.y = 0.02;
        dynamicCityGroup.add(roadH);

        const roadV = new THREE.Mesh(new THREE.PlaneGeometry(8, 100), roadMat);
        roadV.rotation.x = -Math.PI / 2;
        roadV.position.y = 0.03;
        dynamicCityGroup.add(roadV);

        const buildingColors = [0x475569, 0x64748b, 0x334155, 0x1e293b];
        const bGeos = [];
        for (let x = -40; x <= 40; x += 12) {
          for (let z = -40; z <= 40; z += 12) {
            if (Math.abs(x) < 8 || Math.abs(z) < 8) continue;
            const width = 8 + Math.random() * 4;
            const depth = 8 + Math.random() * 4;
            const height = 15 + Math.random() * 35;
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            bGeo.translate(x, height/2, z);
            bGeos.push(bGeo);
          }
        }
        if (bGeos.length > 0) {
          const merged = BufferGeometryUtils.mergeBufferGeometries(bGeos);
          const mat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.3 });
          const mesh = new THREE.Mesh(merged, mat);
          mesh.castShadow = true;
          dynamicCityGroup.add(mesh);
        }
      }

      fetchAndBuildOSMData();

      // Player state & movement within 50m radius limit
      const playerPos = new THREE.Vector3(0, 1.7, 25);
      camera.position.copy(playerPos);

      let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
      let pitch = 0, yaw = 0;

      const onKeyDown = (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') moveForward = true;
        if (e.key === 's' || e.key === 'ArrowDown') moveBackward = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') moveLeft = true;
        if (e.key === 'd' || e.key === 'ArrowRight') moveRight = true;
      };

      const onKeyUp = (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') moveForward = false;
        if (e.key === 's' || e.key === 'ArrowDown') moveBackward = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') moveLeft = false;
        if (e.key === 'd' || e.key === 'ArrowRight') moveRight = false;
      };

      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      let isMouseDown = false;
      let mouseX = 0, mouseY = 0;

      container.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => { isMouseDown = false; });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - mouseX;
        const deltaY = e.clientY - mouseY;
        mouseX = e.clientX;
        mouseY = e.clientY;

        yaw -= deltaX * 0.003;
        pitch -= deltaY * 0.003;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      });

      // Touch controls for mobile movement
      const fwdBtn = document.getElementById('btn-forward');
      if (fwdBtn) {
        fwdBtn.addEventListener('touchstart', () => { moveForward = true; });
        fwdBtn.addEventListener('touchend', () => { moveForward = false; });
      }

      const handleResize = () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      };
      window.addEventListener('resize', handleResize);

      // Animation Loop with real-time updates as player moves
      let animationFrameId;
      const speed = 0.15;
      let lastReloadPos = new THREE.Vector3(0, 0, 0);

      const animate = () => {
        animationFrameId = requestAnimationFrame(animate);

        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        dir.y = 0;
        dir.normalize();

        const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

        if (moveForward) camera.position.addScaledVector(dir, speed);
        if (moveBackward) camera.position.addScaledVector(dir, -speed);
        if (moveLeft) camera.position.addScaledVector(sideDir, speed);
        if (moveRight) camera.position.addScaledVector(sideDir, -speed);

        // Enforce 50-meter radius limit around origin (0,0)
        const distFromCenter = Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z);
        if (distFromCenter > 50) {
          camera.position.x = (camera.position.x / distFromCenter) * 50;
          camera.position.z = (camera.position.z / distFromCenter) * 50;
        }

        camera.position.y = 1.7; // Maintain eye height

        // If player moves significantly, update generation anchor offset
        if (camera.position.distanceTo(lastReloadPos) > 30) {
          lastReloadPos.copy(camera.position);
        }

        const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);

        renderer.render(scene, camera);
      };

      animate();

      threeApp = {
        cleanup: () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
        }
      };
    }
  </script>
