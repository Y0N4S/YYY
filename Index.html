<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Maps Clone</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e5e3df;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Hide default Leaflet zoom controls (we build custom bottom-right Google-style controls) */
    .leaflet-control-zoom {
      display: none !important;
    }

    .leaflet-control-attribution {
      font-size: 10px !important;
      background: rgba(255, 255, 255, 0.78) !important;
      backdrop-filter: blur(4px);
      padding: 2px 6px !important;
      border-top-left-radius: 6px;
      color: #5f6368 !important;
    }

    /* Custom Scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .thin-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 9999px;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #bdc1c6;
    }

    /* Google Pin Drop Animation */
    @keyframes pinDrop {
      0% {
        transform: translateY(-24px) scale(0.8);
        opacity: 0;
      }
      70% {
        transform: translateY(3px) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .google-pin-wrapper {
      animation: pinDrop 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* User Pulse Dot */
    @keyframes userPulse {
      0% {
        transform: scale(0.85);
        opacity: 0.75;
      }
      70% {
        transform: scale(2.2);
        opacity: 0;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .user-pulse-ring {
      animation: userPulse 2s infinite ease-out;
    }

    /* Street View Panoramic Simulation */
    .streetview-panorama {
      background-size: 200% 100%;
      transition: background-position 0.1s linear;
      cursor: grab;
    }
    .streetview-panorama:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="relative w-full h-full select-none text-[#202124]">

  <!-- Full-Viewport Interactive Map -->
  <div id="map"></div>

  <!-- Top Floating Search Bar + Category Chips -->
  <div id="top-ui-container" class="fixed top-3 left-3 right-3 sm:right-auto z-30 flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 pointer-events-none">
    
    <!-- Search Pill Box -->
    <div class="relative w-full sm:w-[392px] pointer-events-auto">
      <div class="flex items-center bg-white rounded-full shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 h-12 px-3 transition-shadow focus-within:shadow-[0_4px_12px_rgba(60,64,67,0.32)]">
        <!-- Hamburger / Saved Places Menu Button -->
        <button id="btn-menu" title="Saved places & menu" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Search Input -->
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          placeholder="Search Google Maps"
          class="w-full px-2.5 text-[15px] text-[#202124] placeholder-[#70757a] bg-transparent outline-none"
        />

        <!-- Clear Search Button -->
        <button id="btn-clear-search" title="Clear search" class="hidden p-1.5 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <!-- Search Submit Button -->
        <button id="btn-search-submit" title="Search" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition-colors flex-shrink-0">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>

        <!-- Vertical Divider -->
        <div class="h-6 w-[1px] bg-gray-200 mx-1 flex-shrink-0"></div>

        <!-- Directions Blue Diamond Button -->
        <button id="btn-open-directions" title="Directions" class="p-2 rounded-full hover:bg-blue-50 text-[#1A73E8] transition-colors flex-shrink-0">
          <div class="w-6 h-6 bg-[#1A73E8] rounded-md rotate-45 flex items-center justify-center shadow-sm">
            <i data-lucide="corner-up-right" class="w-3.5 h-3.5 text-white -rotate-45"></i>
          </div>
        </button>
      </div>

      <!-- Search Autocomplete Dropdown -->
      <div id="search-dropdown" class="hidden mt-1.5 bg-white rounded-2xl shadow-[0_4px_16px_rgba(60,64,67,0.28)] border border-gray-100 overflow-hidden max-h-[340px] overflow-y-auto thin-scrollbar">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Horizontal Category Chips -->
    <div id="category-chips" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 pointer-events-auto max-w-full sm:max-w-[calc(100vw-430px)]">
      <button data-category="restaurant" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="utensils" class="w-4 h-4 text-[#EA4335]"></i>
        <span>Restaurants</span>
      </button>
      <button data-category="cafe" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="coffee" class="w-4 h-4 text-[#9334E6]"></i>
        <span>Coffee</span>
      </button>
      <button data-category="hotel" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="bed" class="w-4 h-4 text-[#E52592]"></i>
        <span>Hotels</span>
      </button>
      <button data-category="park" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="trees" class="w-4 h-4 text-[#188038]"></i>

      </button>
      <button data-category="transit" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="train-front" class="w-4 h-4 text-[#1A73E8]"></i>
        <span>Transit</span>
      </button>
      <button data-category="gas" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="fuel" class="w-4 h-4 text-[#F9AB00]"></i>
        <span>Gas</span>
      </button>
      <button data-category="museum" class="category-chip flex items-center gap-1.5 bg-white hover:bg-gray-50 text-[#3c4043] text-[13px] font-medium px-3.5 py-2 rounded-full shadow-[0_1px_4px_rgba(60,64,67,0.25)] border border-gray-100 whitespace-nowrap transition-all">
        <i data-lucide="landmark" class="w-4 h-4 text-[#12B5CB]"></i>

    </div>
  </div>

  <!-- Left Collapsible Side Drawer (Place Details / Directions / Saved Places) -->

      id="btn-close-drawer"

      class="hidden sm:flex items-center justify-center absolute -right-6 top-1/2 -translate-y-1/2 w-6 h-12 bg-white rounded-r-lg shadow-[2px_0_8px_rgba(60,64,67,0.2)] border-y border-r border-gray-200 text-[#5f6368] hover:text-[#202124]"

    >
      <div id="layers-preview-bg" class="w-full h-full rounded-lg bg-gradient-to-br from-emerald-100 via-amber-50 to-sky-200 relative overflow-hidden">

        <div class="absolute inset-0 opacity-60">
          <div class="w-full h-1.5 bg-amber-300 rotate-12 translate-y-4"></div>
          <div class="w-1.5 h-full bg-white -rotate-12 translate-x-6"></div>
          <div class="w-5 h-5 rounded-full bg-sky-300/70 absolute top-2 right-2"></div>
        </div>
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 via-black/40 to-transparent py-1 px-1.5 flex items-center justify-center gap-1 text-white">
          <i data-lucide="layers" class="w-3 h-3"></i>
          <span class="text-[11px] font-medium tracking-tight">Layers</span>
        </div>
      </div>
    </button>

    <!-- Expandable Layer Options Popover -->

      class="hidden bg-white rounded-2xl shadow-[0_4px_16px_rgba(60,64,67,0.28)] border border-gray-100 p-3.5 w-[272px]"

      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-semibold text-[#5f6368] uppercase tracking-wider">Map Type</span>
        <button id="btn-close-layers" class="p-1 rounded-full hover:bg-gray-100 text-[#5f6368]">

        </button>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-3.5">
        <button data-layer="default" class="layer-option flex flex-col items-center gap-1 group">

            <i data-lucide="map" class="w-5 h-5 text-[#1A73E8]"></i>
          </div>
          <span class="text-[11px] font-medium text-[#1A73E8]">Default</span>
        </button>
        <button data-layer="satellite" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-slate-800 via-emerald-900 to-teal-900 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="globe" class="w-5 h-5 text-emerald-300"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Satellite</span>
        </button>
        <button data-layer="terrain" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-lime-200 via-stone-200 to-emerald-200 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="mountain" class="w-5 h-5 text-emerald-800"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Terrain</span>
        </button>
        <button data-layer="dark" class="layer-option flex flex-col items-center gap-1 group">
          <div class="w-12 h-12 rounded-xl border-2 border-transparent bg-gradient-to-br from-zinc-900 via-slate-900 to-neutral-800 shadow-sm overflow-hidden flex items-center justify-center">
            <i data-lucide="moon" class="w-5 h-5 text-indigo-300"></i>
          </div>
          <span class="text-[11px] font-medium text-[#5f6368]">Dark</span>
        </button>

        <span class="text-xs font-semibold text-[#5f6368] uppercase tracking-wider block mb-2">Map Details</span>
        <div class="grid grid-cols-2 gap-2">
          <button id="toggle-transit-overlay" class="flex items-center gap-2 px-2.5 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-xs font-medium text-[#3c4043] transition-colors">

            <span>Transit</span>

            <i data-lucide="car" class="w-4 h-4 text-[#188038]"></i>
            <span>Traffic</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom-Right Navigation Controls (Locate Me, Zoom +/-, Pegman Street View) -->
  <div class="fixed bottom-6 right-3 z-20 flex flex-col items-center gap-2.5">
    <!-- Locate Me Button -->
    <button
      id="btn-locate-me"
      title="Show your location"
      class="w-10 h-10 bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex items-center justify-center text-[#5f6368] hover:text-[#1A73E8] hover:bg-gray-50 transition-colors"
    >
      <i data-lucide="locate-fixed" class="w-5 h-5"></i>
    </button>

    <!-- Zoom In / Out Pill -->
    <div class="bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex flex-col overflow-hidden">
      <button
        id="btn-zoom-in"
        title="Zoom in"
        class="w-10 h-10 flex items-center justify-center text-[#5f6368] hover:text-[#202124] hover:bg-gray-50 transition-colors border-b border-gray-100"
      >
        <i data-lucide="plus" class="w-5 h-5"></i>
      </button>
      <button
        id="btn-zoom-out"
        title="Zoom out"
        class="w-10 h-10 flex items-center justify-center text-[#5f6368] hover:text-[#202124] hover:bg-gray-50 transition-colors"
      >
        <i data-lucide="minus" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Pegman / Street View Button -->
    <button
      id="btn-street-view"
      title="Browse Street View"
      class="w-10 h-10 bg-white rounded-xl shadow-[0_2px_6px_rgba(60,64,67,0.28)] border border-gray-100 flex items-center justify-center text-[#F9AB00] hover:bg-amber-50 transition-colors"
    >
      <i data-lucide="person-standing" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Toast Notification Pill (Replaces any alert()) -->
  <div
    id="toast-banner"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 pointer-events-none opacity-0 translate-y-3 transition-all duration-300 bg-[#202124] text-white text-xs sm:text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2"
  >
    <span id="toast-message">Notification</span>
  </div>

  <!-- Simulated 360° Street View Modal -->
  <div id="streetview-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col">
    <!-- Top Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent text-white z-10">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-[#F9AB00]/20 border border-[#F9AB00] flex items-center justify-center text-[#F9AB00]">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="sv-title" class="text-sm font-semibold">Street View — Downtown Toronto</h3>
          <p id="sv-coords" class="text-xs text-gray-300">43.6532° N, 79.3832° W • Drag horizontally to look around 360°</p>
        </div>
      </div>
      <button id="btn-close-streetview" class="p-2 rounded-full bg-white/15 hover:bg-white/25 text-white transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Interactive Draggable Panorama Canvas -->
    <div
      id="sv-panorama"
      class="streetview-panorama flex-1 relative overflow-hidden flex items-center justify-center"

    >
      <!-- Simulated Ground Direction Arrows -->
      <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-6 pointer-events-none">
        <div class="px-4 py-2 rounded-full bg-black/55 backdrop-blur-md border border-white/25 text-white text-xs flex items-center gap-2">
          <i data-lucide="move-horizontal" class="w-4 h-4 text-[#F9AB00]"></i>
          <span>Drag left or right to pan 360°</span>
        </div>
      </div>
    </div>
  </div>

          maxZoom: 19
        }),
        satellite: L.layerGroup([
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
            maxZoom: 19
          }),
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Labels &copy; Esri',
            maxZoom: 19,
            opacity: 0.9
          })

        terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey',

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {

      const ttcLine1 = L.polyline([

        [43.6452, -79.3807], // Union
        [43.6548, -79.3883], // St Patrick
        [43.6672, -79.3999], // St George
        [43.6992, -79.4363], // Eglinton West
        [43.7495, -79.4622], // Sheppard West
        [43.7942, -79.5275]  // Vaughan Metropolitan Centre
      ], { color: '#F9AB00', weight: 5, opacity: 0.9 });

      const ttcLine2 = L.polyline([
        [43.6372, -79.5361], // Kipling
        [43.6516, -79.4760], // High Park
        [43.6626, -79.4243], // Ossington
        [43.6672, -79.3999], // St George
        [43.6709, -79.3857], // Bloor-Yonge
        [43.6788, -79.3447], // Pape

        [43.7325, -79.2636]  // Kennedy
      ], { color: '#188038', weight: 5, opacity: 0.9 });

      state.transitLayer = L.layerGroup([transportOverlay, ttcLine1, ttcLine2]);

      // Simulated Live Traffic Flow Corridors along major Toronto arteries
      state.trafficLayer = L.layerGroup([
        L.polyline([[43.6395, -79.4150], [43.6435, -79.3800], [43.6485, -79.3520]], { color: '#EA4335', weight: 5, opacity: 0.85 }), // Gardiner Expy heavy
        L.polyline([[43.6455, -79.3785], [43.6710, -79.3858], [43.7060, -79.3982]], { color: '#F9AB00', weight: 4.5, opacity: 0.85 }), // Yonge St moderate
        L.polyline([[43.6520, -79.4250], [43.6565, -79.3800], [43.6605, -79.3450]], { color: '#188038', weight: 4.5, opacity: 0.85 }), // Queen / Dundas smooth

      // Render subtle initial landmarks so the map immediately feels alive
      renderDefaultLandmarks();

      // Click anywhere on map to inspect coordinates & reverse geocode
      state.map.on('click', async (e) => {

      });
    }

    // =========================================================================
    // 3. CUSTOM PIN CREATION & LANDMARK RENDERING
    // =========================================================================
    function createGooglePinIcon(color = '#EA4335', isSelected = false) {
      const scale = isSelected ? 'scale(1.22)' : 'scale(1)';
      return L.divIcon({
        className: 'custom-google-pin',
        iconSize: [32, 42],
        iconAnchor: [16, 40],
        popupAnchor: [0, -38],
        html: `
          <div class="google-pin-wrapper" style="transform: ${scale}; transform-origin: bottom center;">
            <svg width="32" height="42" viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 0C7.16344 0 0 7.16344 0 16C0 27.25 16 42 16 42C16 42 32 27.25 32 16C32 7.16344 24.8366 0 16 0Z" fill="${color}"/>
              <path d="M16 1C7.71573 1 1 7.71573 1 16C1 26.4 16 40.5 16 40.5C16 40.5 31 26.4 31 16C31 7.71573 24.2843 1 16 1Z" stroke="white" stroke-width="1.5" stroke-opacity="0.75"/>
              <circle cx="16" cy="15.5" r="5.5" fill="white"/>
            </svg>
          </div>
        `
      });
    }

    function renderDefaultLandmarks() {
      state.markersLayer.clearLayers();
      // Show top 6 landmarks initially
      const featured = CURATED_PLACES.slice(0, 6);
      featured.forEach((place) => {
        addPlaceMarker(place, false);
      });
    }

    function addPlaceMarker(place, isSelected = false) {
      const meta = CATEGORY_META[place.category] || CATEGORY_META.default;
      const marker = L.marker([place.lat, place.lng], {
        icon: createGooglePinIcon(meta.color, isSelected),
        zIndexOffset: isSelected ? 1000 : 100
      });

      marker.bindTooltip(place.name, {
        direction: 'top',
        offset: [0, -36],
        className: 'font-medium text-xs px-2 py-1 rounded-md shadow-sm'
      });

      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        selectPlace(place);
      });

      marker.addTo(state.markersLayer);
      return marker;
    }

    // =========================================================================
    // 4. PLACE SELECTION, REVERSE GEOCODING & DRAWER VIEWS
    // =========================================================================
    function selectPlace(place, flyTo = true) {
      state.selectedPlace = place;
      state.drawerMode = 'place';

      // Refresh markers so selected pin pops
      state.markersLayer.clearLayers();
      if (state.activeCategory) {
        CURATED_PLACES.filter((p) => p.category === state.activeCategory).forEach((p) => {
          addPlaceMarker(p, p.id === place.id);
        });
      } else {
        addPlaceMarker(place, true);
      }

      if (flyTo) {
        state.map.flyTo([place.lat, place.lng], Math.max(state.map.getZoom(), 15), {
          duration: 0.75
        });
      }

      renderPlaceDetailsDrawer(place);
      openDrawer('Place Details');
    }

    async function handleMapClickReverseGeocode(lat, lng) {
      const tempPlace = {
        id: `pin-${lat.toFixed(5)}-${lng.toFixed(5)}`,
        name: 'Dropped Pin',
        category: 'default',
        categoryLabel: `${lat.toFixed(5)}, ${lng.toFixed(5)}`,
        rating: null,
        reviews: null,
        address: 'Looking up address...',
        lat,
        lng,
        hours: 'Public area',
        phone: null,
        website: null,
        photo: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80',
        description: 'Custom dropped pin location. Click Directions to route here or save this spot.'
      };

      selectPlace(tempPlace, false);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.display_name) {
            const parts = data.display_name.split(',');
            tempPlace.name = parts[0].trim() || 'Dropped Pin';
            tempPlace.address = parts.slice(0, 4).join(',').trim();
            if (state.selectedPlace && state.selectedPlace.id === tempPlace.id) {
              renderPlaceDetailsDrawer(tempPlace);
            }
          }
        }
      } catch (err) {
        tempPlace.address = `Coordinates: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        if (state.selectedPlace && state.selectedPlace.id === tempPlace.id) {
          renderPlaceDetailsDrawer(tempPlace);
        }
      }
    }

    async function resolveTextLocation(query) {
      const lower = query.toLowerCase();
      const localMatch = CURATED_PLACES.find((p) => p.name.toLowerCase().includes(lower));
      if (localMatch) return { lat: localMatch.lat, lng: localMatch.lng, name: localMatch.name };

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          return {
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon),
            name: data[0].display_name.split(',')[0]
          };
        }
      } catch (e) {}
      return null;
    }

    async function calculateAndDrawRoute() {
      const container = document.getElementById('route-results-container');
      if (!state.originCoords || !state.destCoords) return;

      const osrmProfile = state.travelMode === 'walking' ? 'foot' : state.travelMode === 'cycling' ? 'bike' : 'driving';
      const [oLat, oLng] = state.originCoords;
      const [dLat, dLng] = state.destCoords;

      try {
        const url = `https://router.project-osrm.org/route/v1/${osrmProfile}/${oLng},${oLat};${dLng},${dLat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);

          // Adjust duration slightly for realistic transit mode simulation
          let durationSec = route.duration;
          if (state.travelMode === 'transit') durationSec *= 1.35;

          const mins = Math.max(1, Math.round(durationSec / 60));
          const km = (route.distance / 1000).toFixed(1);

          drawRoutePolyline(coords);

          const steps = route.legs[0].steps || [];
          container.innerHTML = `
            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4 mb-4">
              <div class="flex items-baseline justify-between">
                <span class="text-xl font-bold text-[#188038]">${mins} min</span>
                <span class="text-sm font-medium text-[#5f6368]">${km} km</span>
              </div>
              <p class="text-xs text-[#5f6368] mt-1">Fastest route now via ${steps[0]?.name || 'main streets'}</p>
            </div>

            <div class="space-y-3">
              ${steps.slice(0, 12).map((step, idx) => {
                const stepDist = step.distance > 1000 ? `${(step.distance / 1000).toFixed(1)} km` : `${Math.round(step.distance)} m`;
                const instruction = formatOsrmStep(step, idx === steps.length - 1);
                return `
                  <div class="flex items-start gap-3 pb-3 border-b border-gray-100 last:border-none">
                    <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-[#1A73E8] flex-shrink-0 mt-0.5">
                      <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm text-[#202124]">${instruction}</p>
                      <p class="text-xs text-[#70757a] mt-0.5">${stepDist}</p>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
          lucide.createIcons();
          return;
        }
      } catch (err) {
        // Fallback straight-line route if OSRM is unreachable
      }

      // Fallback route rendering
      const fallbackCoords = [[oLat, oLng], [dLat, dLng]];
      drawRoutePolyline(fallbackCoords);
      const approxKm = (state.map.distance([oLat, oLng], [dLat, dLng]) / 1000).toFixed(1);
      const approxMins = Math.max(2, Math.round(approxKm * (state.travelMode === 'walking' ? 12 : 3)));

      container.innerHTML = `
        <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4">
          <div class="flex items-baseline justify-between">
            <span class="text-xl font-bold text-[#188038]">${approxMins} min</span>
            <span class="text-sm font-medium text-[#5f6368]">${approxKm} km</span>
          </div>
          <p class="text-xs text-[#5f6368] mt-1">Direct route from ${state.originLabel} to ${state.destLabel}</p>
        </div>
      `;
    }

    function formatOsrmStep(step, isLast) {
      if (isLast) return `Arrive at <strong>${state.destLabel}</strong>`;
      const mod = step.maneuver?.modifier ? ` ${step.maneuver.modifier}` : '';
      const type = step.maneuver?.type || 'continue';
      const road = step.name ? ` onto <strong>${step.name}</strong>` : '';
      const action = type === 'depart' ? 'Head' : type === 'turn' ? 'Turn' : 'Continue';
      return `${action}${mod}${road}`;
    }

    function drawRoutePolyline(coords) {
      state.routeLayer.clearLayers();
      state.markersLayer.clearLayers();

      // Outer border + inner Google Blue route path
      const outer = L.polyline(coords, { color: '#1557B0', weight: 8, opacity: 0.85, lineCap: 'round' });
      const inner = L.polyline(coords, { color: '#4285F4', weight: 5, opacity: 1, lineCap: 'round' });

      // Origin circle & destination pin
      const startDot = L.circleMarker(coords[0], {
        radius: 7,
        color: '#202124',
        weight: 2.5,
        fillColor: '#ffffff',
        fillOpacity: 1
      });
      const endPin = L.marker(coords[coords.length - 1], {
        icon: createGooglePinIcon('#EA4335', true)
      });

      state.routeLayer.addLayer(outer);
      state.routeLayer.addLayer(inner);
      state.routeLayer.addLayer(startDot);
      state.routeLayer.addLayer(endPin);

      state.map.fitBounds(outer.getBounds(), {
        paddingTopLeft: [window.innerWidth > 640 ? 430 : 40, 90],
        paddingBottomRight: [50, 60]
      });
    }

      if (state.drawerMode === 'place' && state.selectedPlace?.id === place.id) {
        renderPlaceDetailsDrawer(place);
      } else if (state.drawerMode === 'saved') {
        renderSavedPlacesDrawer();

    // =========================================================================
    // 7. SEARCH BAR AUTOCOMPLETE & CATEGORY DISCOVERY CHIPS
    // =========================================================================
    let searchTimeout = null;

    function initSearchAndChips() {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('btn-clear-search');
      const submitBtn = document.getElementById('btn-search-submit');

      searchInput.addEventListener('input', () => {
        const val = searchInput.value.trim();
        clearBtn.classList.toggle('hidden', val.length === 0);

        clearTimeout(searchTimeout);
        if (!val) {
          closeSearchDropdown();
          return;
        }

        searchTimeout = setTimeout(() => performAutocompleteSearch(val), 240);
      });

      searchInput.addEventListener('focus', () => {
        const val = searchInput.value.trim();
        if (val) {
          performAutocompleteSearch(val);
        } else {
          renderDropdownResults(CURATED_PLACES.slice(0, 5), []);
        }
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = searchInput.value.trim();
          if (val) performAutocompleteSearch(val, true);
        }
      });

      submitBtn.addEventListener('click', () => {
        const val = searchInput.value.trim();
        if (val) performAutocompleteSearch(val, true);
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        closeSearchDropdown();
        state.routeLayer.clearLayers();
        state.activeCategory = null;
        updateCategoryChipStyles();
        renderDefaultLandmarks();
      });

      // Category Filter Chips
      document.querySelectorAll('.category-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const cat = chip.dataset.category;
          if (state.activeCategory === cat) {
            state.activeCategory = null;
            updateCategoryChipStyles();
            renderDefaultLandmarks();
            showToast('Cleared category filter');
          } else {
            state.activeCategory = cat;
            updateCategoryChipStyles();
            filterByCategory(cat);
          }
        });
      });
    }

    async function performAutocompleteSearch(query, autoSelectFirst = false) {
      const lower = query.toLowerCase();
      const localMatches = CURATED_PLACES.filter(
        (p) =>
          p.name.toLowerCase().includes(lower) ||
          p.categoryLabel.toLowerCase().includes(lower) ||
          p.address.toLowerCase().includes(lower)
      );

      let remoteMatches = [];
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`
        );
        if (res.ok) {
          const data = await res.json();
          remoteMatches = data.map((item) => {
            const parts = item.display_name.split(',');
            return {
              id: `osm-${item.place_id}`,
              name: parts[0].trim(),
              category: 'default',
              categoryLabel: item.type ? item.type.replace(/_/g, ' ') : 'Location',
              rating: null,
              reviews: null,
              address: parts.slice(0, 4).join(',').trim(),
              lat: parseFloat(item.lat),
              lng: parseFloat(item.lon),
              hours: 'Open',
              phone: null,
              website: null,
              photo: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80',
              description: item.display_name
            };
          });
        }
      } catch (e) {}

      const combined = [...localMatches, ...remoteMatches];
      if (autoSelectFirst && combined.length > 0) {
        closeSearchDropdown();
        selectPlace(combined[0]);
        return;
      }

      renderDropdownResults(localMatches, remoteMatches);
    }

    function renderDropdownResults(localPlaces, remotePlaces) {
      const dropdown = document.getElementById('search-dropdown');
      const all = [...localPlaces, ...remotePlaces].slice(0, 7);

      if (all.length === 0) {
        dropdown.innerHTML = `<div class="px-4 py-3.5 text-sm text-[#70757a]">No matching locations found</div>`;
        dropdown.classList.remove('hidden');
        return;
      }

      dropdown.innerHTML = all
        .map(
          (p, idx) => `
          <button
            data-result-idx="${idx}"
            class="search-result-item w-full flex items-center gap-3.5 px-4 py-3 hover:bg-gray-100 text-left border-b border-gray-50 last:border-none transition-colors"
          >
            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-[#5f6368] flex-shrink-0">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#202124] truncate">${p.name}</p>
              <p class="text-xs text-[#70757a] truncate">${p.address}</p>
            </div>
          </button>
        `
        )
        .join('');

      dropdown.classList.remove('hidden');
      lucide.createIcons();

      dropdown.querySelectorAll('.search-result-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const picked = all[parseInt(btn.dataset.resultIdx, 10)];
          document.getElementById('search-input').value = picked.name;
          document.getElementById('btn-clear-search').classList.remove('hidden');
          closeSearchDropdown();
          selectPlace(picked);
        });
      });
    }

    function closeSearchDropdown() {
      document.getElementById('search-dropdown').classList.add('hidden');
    }

    function filterByCategory(category) {
      const matches = CURATED_PLACES.filter((p) => p.category === category);
      state.markersLayer.clearLayers();
      state.routeLayer.clearLayers();

      const bounds = [];
      matches.forEach((p) => {
        addPlaceMarker(p, false);
        bounds.push([p.lat, p.lng]);
      });

      if (bounds.length > 0) {
        state.map.fitBounds(bounds, { padding: [90, 90], maxZoom: 15 });
      }

      const meta = CATEGORY_META[category];
      showToast(`Showing ${matches.length} ${meta.label} nearby`);
    }

    function updateCategoryChipStyles() {
      document.querySelectorAll('.category-chip').forEach((chip) => {
        const isActive = chip.dataset.category === state.activeCategory;
        if (isActive) {
          chip.classList.add('bg-[#1A73E8]', 'text-white', 'border-[#1A73E8]');
          chip.classList.remove('bg-white', 'text-[#3c4043]');
        } else {
          chip.classList.remove('bg-[#1A73E8]', 'text-white', 'border-[#1A73E8]');
          chip.classList.add('bg-white', 'text-[#3c4043]');
        }
      });
    }

    // =========================================================================
    function openDrawer(mobileTitle = 'Details') {
      const drawer = document.getElementById('side-drawer');

    function closeDrawer() {

    }

    function switchBaseLayer(layerKey) {
      if (state.activeBaseLayer === layerKey) return;
      state.map.removeLayer(state.baseLayers[state.activeBaseLayer]);
      state.baseLayers[layerKey].addTo(state.map);
      state.activeBaseLayer = layerKey;

      document.querySelectorAll('.layer-option').forEach((btn) => {
        const active = btn.dataset.layer === layerKey;
        const box = btn.querySelector('div');
        const label = btn.querySelector('span');
        if (active) {
          box.classList.add('border-[#1A73E8]');
          box.classList.remove('border-transparent');
          label.classList.add('text-[#1A73E8]');
          label.classList.remove('text-[#5f6368]');
        } else {
          box.classList.remove('border-[#1A73E8]');
          box.classList.add('border-transparent');
          label.classList.remove('text-[#1A73E8]');
          label.classList.add('text-[#5f6368]');
        }
      });
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser');
        return;
      }
      showToast('Locating your position...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          state.originCoords = [latitude, longitude];
          state.originLabel = 'Your Location';

          if (state.userMarker) state.map.removeLayer(state.userMarker);
          state.userMarker = L.marker([latitude, longitude], {
            icon: L.divIcon({
              className: 'user-location-dot',
              iconSize: [24, 24],
              iconAnchor: [12, 12],
              html: `
                <div class="relative w-6 h-6 flex items-center justify-center">
                  <div class="user-pulse-ring absolute inset-0 rounded-full bg-[#1A73E8]"></div>
                  <div class="relative w-4 h-4 rounded-full bg-[#1A73E8] border-2 border-white shadow-md"></div>
                </div>
              `
            })
          }).addTo(state.map);

          state.map.flyTo([latitude, longitude], 15, { duration: 0.85 });
          showToast('Centered on your location');
        },
        () => {
          // Graceful fallback to Downtown Toronto center if permission denied in sandbox
          state.map.flyTo(DEFAULT_CENTER, DEFAULT_ZOOM, { duration: 0.8 });
          showToast('Centered on Downtown Toronto');
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    function openStreetView(place = null) {
      const modal = document.getElementById('streetview-modal');
      const titleEl = document.getElementById('sv-title');
      const coordsEl = document.getElementById('sv-coords');
      const panoEl = document.getElementById('sv-panorama');

      const center = place ? { lat: place.lat, lng: place.lng } : state.map.getCenter();
      titleEl.textContent = place ? `Street View — ${place.name}` : 'Street View — Toronto Exploration';
      coordsEl.textContent = `${center.lat.toFixed(4)}° N, ${Math.abs(center.lng).toFixed(4)}° W • Drag horizontally to pan 360°`;

      if (place && place.photo) {
        panoEl.style.backgroundImage = `url('${place.photo}')`;
      }

      modal.classList.remove('hidden');
    }

    function initStreetViewDrag() {
      const panoEl = document.getElementById('sv-panorama');

      const startDrag = (clientX) => {
        state.svDragging = true;
        state.svStartX = clientX;
      };

      const moveDrag = (clientX) => {
        if (!state.svDragging) return;
        const delta = (clientX - state.svStartX) * 0.12;
        state.svStartX = clientX;
        state.svPanX = (state.svPanX - delta + 100) % 100;
        panoEl.style.backgroundPosition = `${state.svPanX}% 50%`;
      };

      const endDrag = () => {
        state.svDragging = false;
      };

      panoEl.addEventListener('mousedown', (e) => startDrag(e.clientX));
      window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
      window.addEventListener('mouseup', endDrag);

      panoEl.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
      panoEl.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
      panoEl.addEventListener('touchend', endDrag);
    }

    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const text = document.getElementById('toast-message');
      text.textContent = msg;
      banner.classList.remove('opacity-0', 'translate-y-3');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-3');
      }, 2800);
    }

    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    // =========================================================================
    // 9. BOOTSTRAP ALL EVENT LISTENERS ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      initSearchAndChips();
      initStreetViewDrag();

      // Top Menu & Directions Buttons
      document.getElementById('btn-menu').addEventListener('click', () => {
        if (state.drawerMode === 'saved') {
          closeDrawer();
        } else {
          openSavedPlacesDrawer();
        }
      });

      document.getElementById('btn-open-directions').addEventListener('click', () => {
        if (state.selectedPlace) {
          state.destCoords = [state.selectedPlace.lat, state.selectedPlace.lng];
          state.destLabel = state.selectedPlace.name;
        }
        openDirectionsDrawer();
      });

      // Drawer Close Buttons
      document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
      document.getElementById('btn-close-drawer-mobile').addEventListener('click', closeDrawer);

      // Layers Popover Controls
      const layersPopover = document.getElementById('layers-popover');
      document.getElementById('btn-toggle-layers').addEventListener('click', () => {
        layersPopover.classList.toggle('hidden');
      });
      document.getElementById('btn-close-layers').addEventListener('click', () => {
        layersPopover.classList.add('hidden');
      });

      document.querySelectorAll('.layer-option').forEach((btn) => {
        btn.addEventListener('click', () => switchBaseLayer(btn.dataset.layer));
      });

      // Transit & Traffic Overlays
      const transitBtn = document.getElementById('toggle-transit-overlay');
      transitBtn.addEventListener('click', () => {
        state.transitActive = !state.transitActive;
        if (state.transitActive) {
          state.transitLayer.addTo(state.map);
          transitBtn.classList.add('bg-blue-50', 'border-[#1A73E8]', 'text-[#1A73E8]');
          showToast('Transit lines enabled');
        } else {
          state.map.removeLayer(state.transitLayer);
          transitBtn.classList.remove('bg-blue-50', 'border-[#1A73E8]', 'text-[#1A73E8]');
          showToast('Transit lines hidden');
        }
      });

      const trafficBtn = document.getElementById('toggle-traffic-overlay');
      trafficBtn.addEventListener('click', () => {
        state.trafficActive = !state.trafficActive;
        if (state.trafficActive) {
          state.trafficLayer.addTo(state.map);
          trafficBtn.classList.add('bg-emerald-50', 'border-[#188038]', 'text-[#188038]');
          showToast('Live traffic layer enabled');
        } else {
          state.map.removeLayer(state.trafficLayer);
          trafficBtn.classList.remove('bg-emerald-50', 'border-[#188038]', 'text-[#188038]');
          showToast('Live traffic layer hidden');
        }
      });

      // Bottom-Right Map Navigation Controls
      document.getElementById('btn-zoom-in').addEventListener('click', () => state.map.zoomIn());
      document.getElementById('btn-zoom-out').addEventListener('click', () => state.map.zoomOut());
      document.getElementById('btn-locate-me').addEventListener('click', locateUser);
      document.getElementById('btn-street-view').addEventListener('click', () => openStreetView(state.selectedPlace));
      document.getElementById('btn-close-streetview').addEventListener('click', () => {
        document.getElementById('streetview-modal').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
