<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First-Person Template</title>
<style>
  :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); --edge:rgba(255,255,255,.18); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); } }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fb7c9; font-family: system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; width:100%; height:100%; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(8,10,14,.45); }
  #card { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:22px 28px; max-width:340px; line-height:1.5; }
  #card h1 { margin:0 0 8px; font-size:20px; }
  #card p { margin:4px 0; font-size:14px; }
  kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:1px 6px; font-size:12px; }
  #cross { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px; border-radius:50%; background:#fff; mix-blend-mode:difference; pointer-events:none; }
  #hud { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:12px ui-monospace, monospace; background:var(--panel); padding:6px 10px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="cross"></div>
<div id="hud"></div>
<div id="overlay"><div id="card">
  <h1>First-person template</h1>
  <p>Click to capture the mouse.</p>
  <p><kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> sprint</p>
  <p><kbd>Space</kbd> jump &nbsp; <kbd>C</kbd> crouch &nbsp; <kbd>Esc</kbd> release</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= CONFIG: tweak these ================= */
const CFG = {
  walkSpeed: 5, sprintSpeed: 8.5, crouchSpeed: 2.5,
  groundAccel: 60,   // how fast you reach target speed on ground
  airControl: 0.25,  // fraction of accel while airborne
  jumpSpeed: 7.5, gravity: 22,
  standHeight: 1.8, crouchHeight: 1.1, eyeOffset: 0.15, // eye = top of body - eyeOffset
  radius: 0.35,
  sensitivity: 0.0022, maxPitch: 89 * Math.PI / 180,
  fov: 75, sprintFovBoost: 8,
  bobAmount: 0.05, bobSpeed: 9
};

/* ================= Scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb7c9);
scene.fog = new THREE.Fog(0x9fb7c9, 25, 90);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(10, 20, 5); scene.add(sun);

const camera = new THREE.PerspectiveCamera(CFG.fov, 1, 0.05, 200);
camera.rotation.order = 'YXZ';   // yaw first, then pitch: no roll

/* ================= World (replace with your level) ================= */
const solids = [];               // collision boxes (THREE.Box3)
function addBox(x, y, z, w, h, d, color) { // x,z = center; y = bottom
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y + h / 2, z); scene.add(m);
  solids.push(new THREE.Box3().setFromObject(m));
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x6f8f6a }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
scene.add(new THREE.GridHelper(200, 100, 0x000000, 0x000000).translateY(0.01));
scene.children[scene.children.length - 1].material.opacity = 0.12;
scene.children[scene.children.length - 1].material.transparent = true;
addBox(0, 0, -8, 6, 1, 3, 0xc98f5a);       // low step
addBox(0, 0, -12, 4, 2.2, 3, 0xb9744a);    // high step
addBox(8, 0, -4, 2, 4, 10, 0x8a8fa8);      // wall
addBox(-8, 0, -6, 3, 0.5, 3, 0xd9c36a);
addBox(-8, 0, -10, 3, 1.5, 3, 0xd9a05a);
addBox(-8, 0, -14, 3, 2.5, 3, 0xd97a5a);   // staircase of jumps

/* ================= Player state ================= */
const player = {
  pos: new THREE.Vector3(0, 0, 6),   // feet position
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  height: CFG.standHeight,
  grounded: false, bob: 0, fov: CFG.fov
};

/* ================= Input ================= */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.code] = false; });
addEventListener('blur',    () => { for (const k in keys) keys[k] = false; });

const overlay = document.getElementById('overlay');
let locked = false, dragLook = false;
function look(dx, dy) {
  player.yaw   -= dx * CFG.sensitivity;
  player.pitch  = Math.max(-CFG.maxPitch, Math.min(CFG.maxPitch, player.pitch - dy * CFG.sensitivity));
}
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  try { renderer.domElement.requestPointerLock(); } catch (e) {}
  setTimeout(() => { if (!locked) dragLook = true; }, 300); // fallback if pointer lock is blocked
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) dragLook = false; else if (!dragLook) overlay.style.display = 'flex';
});
addEventListener('mousemove', e => {
  if (locked) look(e.movementX, e.movementY);
  else if (dragLook && e.buttons) look(e.movementX, e.movementY);
});
addEventListener('keydown', e => { if (e.code === 'Escape' && dragLook) { dragLook = false; overlay.style.display = 'flex'; } });

/* ================= Movement + collision ================= */
function overlaps(b) {
  const p = player.pos, r = CFG.radius;
  return p.x + r > b.min.x && p.x - r < b.max.x &&
         p.y + player.height > b.min.y && p.y < b.max.y &&
         p.z + r > b.min.z && p.z - r < b.max.z;
}
// Move one axis at a time, then push out of anything we hit.
function moveAxis(axis, amount) {
  player.pos[axis] += amount;
  for (const b of solids) {
    if (!overlaps(b)) continue;
    if (axis === 'y') {
      if (amount <= 0) { player.pos.y = b.max.y; player.grounded = true; }
      else player.pos.y = b.min.y - player.height;
      player.vel.y = 0;
    } else {
      player.pos[axis] = amount > 0 ? b.min[axis] - CFG.radius : b.max[axis] + CFG.radius;
      player.vel[axis] = 0;
    }
  }
}

function updatePlayer(dt) {
  // crouch (blocked from standing up under a ceiling)
  const wantCrouch = keys.KeyC || keys.ControlLeft;
  const targetH = wantCrouch ? CFG.crouchHeight : CFG.standHeight;
  if (targetH > player.height) {
    const prev = player.height; player.height = targetH;
    if (solids.some(overlaps)) player.height = prev;
  } else player.height = targetH;
  const crouching = player.height < CFG.standHeight - 0.01;

  // wish direction relative to where we're looking
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  let wx = strafe * cos - fwd * sin, wz = -strafe * sin - fwd * cos;
  const len = Math.hypot(wx, wz); if (len > 0) { wx /= len; wz /= len; }

  const sprinting = keys.ShiftLeft && fwd > 0 && !crouching;
  const speed = crouching ? CFG.crouchSpeed : sprinting ? CFG.sprintSpeed : CFG.walkSpeed;
  const accel = CFG.groundAccel * (player.grounded ? 1 : CFG.airControl) * dt;
  const approach = (v, t) => v + Math.max(-accel, Math.min(accel, t - v));
  player.vel.x = approach(player.vel.x, wx * speed);
  player.vel.z = approach(player.vel.z, wz * speed);

  // jump + gravity
  if (keys.Space && player.grounded) player.vel.y = CFG.jumpSpeed;
  player.vel.y -= CFG.gravity * dt;

  // integrate with collision
  player.grounded = false;
  moveAxis('x', player.vel.x * dt);
  moveAxis('z', player.vel.z * dt);
  moveAxis('y', player.vel.y * dt);
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.grounded = true; }

  // view effects: head bob + sprint FOV
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (player.grounded) player.bob += hSpeed * dt * CFG.bobSpeed / CFG.walkSpeed;
  const bobY = player.grounded ? Math.sin(player.bob) * CFG.bobAmount * Math.min(hSpeed / CFG.walkSpeed, 1) : 0;
  const targetFov = CFG.fov + (sprinting && hSpeed > 1 ? CFG.sprintFovBoost : 0);
  player.fov += (targetFov - player.fov) * Math.min(1, dt * 8);
  if (Math.abs(camera.fov - player.fov) > 0.01) { camera.fov = player.fov; camera.updateProjectionMatrix(); }

  // camera follows eye position
  camera.position.set(player.pos.x, player.pos.y + player.height - CFG.eyeOffset + bobY, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  document.getElementById('hud').textContent =
    `speed ${hSpeed.toFixed(1)} m/s · ${player.grounded ? 'grounded' : 'airborne'}${crouching ? ' · crouching' : ''}`;
}

/* ================= Loop ================= */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now();
(function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.1); last = now;
  const steps = Math.ceil(dt / 0.016);          // substeps keep collisions stable on slow frames
  for (let i = 0; i < steps; i++) updatePlayer(dt / steps);
  renderer.render(scene, camera);
})(last);
</script>
</body>
</html>
