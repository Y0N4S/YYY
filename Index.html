<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First-Person Template</title>
<style>
  :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); --edge:rgba(255,255,255,.18); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --ink:#f2f4f7; --panel:rgba(14,18,24,.82); } }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fb7c9; font-family: system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; width:100%; height:100%; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(8,10,14,.45); }
  #card { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:22px 28px; max-width:340px; line-height:1.5; }
  #card h1 { margin:0 0 8px; font-size:20px; }
  #card p { margin:4px 0; font-size:14px; }
  kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:1px 6px; font-size:12px; }
  #cross { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px; border-radius:50%; background:#fff; mix-blend-mode:difference; pointer-events:none; }
  #ratio { position:fixed; z-index:5; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; width:230px; background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:8px 12px; font:12px system-ui, sans-serif; }
  #ratio input { width:100%; margin:6px 0 2px; }
  #ratio .hint { opacity:.7; margin-top:4px; }
  html, body { touch-action:none; -webkit-user-select:none; user-select:none; }
  #touch { display:none; }
  body.touch #touch { display:block; }
  #stick { position:fixed; display:none; width:110px; height:110px; margin:-55px 0 0 -55px; border:2px solid var(--edge); border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none; z-index:3; }
  #knob { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.5); }
  #touch button { position:fixed; z-index:3; border:1px solid var(--edge); border-radius:50%; background:var(--panel); color:var(--ink); font:600 12px system-ui, sans-serif; touch-action:none; }
  #touch button.on { background:rgba(255,255,255,.35); }
  #bJump { right:calc(22px + env(safe-area-inset-right,0px)); bottom:calc(40px + env(safe-area-inset-bottom,0px)); width:78px; height:78px; }
  #bCrouch { right:calc(112px + env(safe-area-inset-right,0px)); bottom:calc(40px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; }
  body.touch #ratio .hint { display:none; }
  body.touch #hud { bottom:auto; top:calc(110px + env(safe-area-inset-top,0px)); }
  body.touch #credit { bottom:calc(4px + env(safe-area-inset-bottom,0px)); left:50%; right:auto; transform:translateX(-50%); font-size:9px; max-width:40vw; }
  #credit { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:11px system-ui, sans-serif; background:var(--panel); padding:5px 9px; border-radius:6px; pointer-events:none; text-align:right; }
  #hud { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:12px ui-monospace, monospace; background:var(--panel); padding:6px 10px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="cross"></div>
<div id="hud"></div>
<div id="credit"></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button id="bJump">Jump</button><button id="bCrouch">Crouch</button></div>
<div id="ratio">
  <label for="rs">Map scale</label>
  <input id="rs" type="range">
  <div id="rv"></div>
  <div class="hint">Keys: <kbd>[</kbd> zoom in, <kbd>]</kbd> zoom out</div>
</div>
<div id="overlay"><div id="card">
  <h1>First-person template</h1>
  <p>Click to capture the mouse.</p>
  <p><kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> sprint</p>
  <p><kbd>Space</kbd> jump &nbsp; <kbd>C</kbd> crouch &nbsp; <kbd>Esc</kbd> release</p>
  <p>Map scale: use the slider (press Esc first) or <kbd>[</kbd> <kbd>]</kbd>.</p>
  <p>Allow location access to texture the ground with the map around you (1 km radius).</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Device: phones/tablets get touch controls. Override for testing with ?touch=1 or ?touch=0 */
const touchParam = new URLSearchParams(location.search).get('touch');
const isTouch = touchParam ? touchParam === '1' : matchMedia('(hover: none) and (pointer: coarse)').matches;

/* ================= CONFIG: tweak these ================= */
const CFG = {
  walkSpeed: 5, sprintSpeed: 8.5, crouchSpeed: 2.5,
  groundAccel: 60,   // how fast you reach target speed on ground
  airControl: 0.25,  // fraction of accel while airborne
  jumpSpeed: 7.5, gravity: 22,
  standHeight: 1.8, crouchHeight: 1.1, eyeOffset: 0.15, // eye = top of body - eyeOffset
  radius: 0.35,
  sensitivity: 0.0022, maxPitch: 89 * Math.PI / 180,
  fov: 75, sprintFovBoost: 8,
  bobAmount: 0.05, bobSpeed: 9,
  mapZoom: 17,       // OSM tile zoom: higher = sharper source image but more requests (16 ≈ 36 tiles, 17 ≈ 100)
  mapRadius: 1000,   // real-world metres of map loaded around you
  mapUnitsPerMetre: 4, // MAP SCALE: real-world metres shown on each 1 m x 1 m floor square. 1 = true scale,
                       // higher = smaller, sharper world (walkable radius = mapRadius / this)
  ratioMin: 0.1, ratioMax: 100,  // slider range
  defaultBuildingHeight: 9,      // metres, when OSM has no height or levels tag
  levelHeight: 3.2,              // metres per building:levels
  buildingRings: [250, 600],     // buildings load in rings (metres) so the nearest ones appear first
  texelTarget: 0.06,             // sharp ground: target world metres per map pixel near you (drives detail tile zoom)
  detailTiles: 3,                // detail tiles loaded this many tiles out from you (3 = 7x7 grid)
  touchLook: 1.6                 // look speed multiplier on touch screens
};

/* ================= Scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb7c9);
scene.fog = new THREE.Fog(0x9fb7c9, 300, 1500);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(10, 20, 5); scene.add(sun);

const camera = new THREE.PerspectiveCamera(CFG.fov, 1, 0.05, 4000);
camera.rotation.order = 'YXZ';   // yaw first, then pitch: no roll

/* ================= World (replace with your level) ================= */
const solids = [], testMeshes = [];               // collision boxes (THREE.Box3)
function addBox(x, y, z, w, h, d, color) { // x,z = center; y = bottom
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y + h / 2, z); scene.add(m); testMeshes.push(m);
  solids.push(new THREE.Box3().setFromObject(m));
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshLambertMaterial({ color: 0x6f8f6a }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(200, 100, 0x000000, 0x000000); grid.position.y = 0.01;
grid.material.opacity = 0.12; grid.material.transparent = true; scene.add(grid);
addBox(0, 0, -8, 6, 1, 3, 0xc98f5a);       // low step
addBox(0, 0, -12, 4, 2.2, 3, 0xb9744a);    // high step
addBox(8, 0, -4, 2, 4, 10, 0x8a8fa8);      // wall
addBox(-8, 0, -6, 3, 0.5, 3, 0xd9c36a);
addBox(-8, 0, -10, 3, 1.5, 3, 0xd9a05a);
addBox(-8, 0, -14, 3, 2.5, 3, 0xd97a5a);   // staircase of jumps

/* ================= Player state ================= */
const player = {
  pos: new THREE.Vector3(0, 0, 0),   // feet position (0,0 = your real location)
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  height: CFG.standHeight,
  grounded: false, bob: 0, fov: CFG.fov
};

/* ================= Input ================= */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.code] = false; });
addEventListener('blur',    () => { for (const k in keys) keys[k] = false; });

const overlay = document.getElementById('overlay');
let locked = false, dragLook = false;
function look(dx, dy) {
  player.yaw   -= dx * CFG.sensitivity;
  player.pitch  = Math.max(-CFG.maxPitch, Math.min(CFG.maxPitch, player.pitch - dy * CFG.sensitivity));
}
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  startLocation();
  if (!isTouch) {
    try { renderer.domElement.requestPointerLock(); } catch (e) {}
    setTimeout(() => { if (!locked) dragLook = true; }, 300); // fallback if pointer lock is blocked
  }
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) dragLook = false; else if (!dragLook) overlay.style.display = 'flex';
});
addEventListener('mousemove', e => {
  if (locked) look(e.movementX, e.movementY);
  else if (dragLook && e.buttons && !e.target.closest('#ratio')) look(e.movementX, e.movementY);
});
addEventListener('keydown', e => { if (e.code === 'Escape' && dragLook) { dragLook = false; overlay.style.display = 'flex'; } });

/* ---- Touch controls: left thumb = floating joystick (push fully to sprint), right thumb = look ---- */
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, lk = { id: null, x: 0, y: 0 };
let touchJump = false, touchCrouch = false;
if (isTouch) {
  document.body.classList.add('touch');
  document.getElementById('card').innerHTML = '<h1>First-person template</h1><p>Tap to start.</p>' +
    '<p>Left thumb: move (push fully to sprint)<br>Right thumb: look<br>Buttons: jump and crouch</p>' +
    '<p>Allow location access to texture the ground with the map around you.</p>';
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'), MAXD = 55;
  const ignored = t => t.target.closest && t.target.closest('#ratio, button');
  addEventListener('touchstart', e => {
    if (overlay.style.display !== 'none') return;             // first tap is handled by the overlay
    let used = false;
    for (const t of e.changedTouches) {
      if (ignored(t)) continue;
      used = true;
      if (t.clientX < innerWidth * 0.45 && joy.id === null) {
        Object.assign(joy, { id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, y: 0 });
        stick.style.cssText = `display:block;left:${t.clientX}px;top:${t.clientY}px`;
        knob.style.transform = 'translate(0,0)';
      } else if (lk.id === null) Object.assign(lk, { id: t.identifier, x: t.clientX, y: t.clientY });
    }
    if (used) e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) {
        let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy; const l = Math.hypot(dx, dy);
        if (l > MAXD) { dx *= MAXD / l; dy *= MAXD / l; }
        joy.x = dx / MAXD; joy.y = dy / MAXD;
        knob.style.transform = `translate(${dx}px,${dy}px)`;
      } else if (t.identifier === lk.id) {
        look((t.clientX - lk.x) * CFG.touchLook, (t.clientY - lk.y) * CFG.touchLook);
        lk.x = t.clientX; lk.y = t.clientY;
      }
    }
  }, { passive: true });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; stick.style.display = 'none'; }
      if (t.identifier === lk.id) lk.id = null;
    }
  };
  addEventListener('touchend', end); addEventListener('touchcancel', end);
  const bJump = document.getElementById('bJump'), bCrouch = document.getElementById('bCrouch');
  bJump.addEventListener('touchstart', e => { e.preventDefault(); touchJump = true; }, { passive: false });
  bJump.addEventListener('touchend', () => { touchJump = false; });
  bCrouch.addEventListener('touchstart', e => { e.preventDefault(); touchCrouch = !touchCrouch; bCrouch.classList.toggle('on', touchCrouch); }, { passive: false });
}

/* ================= Movement + collision ================= */
function overlaps(b) {
  const p = player.pos, r = CFG.radius;
  return p.x + r > b.min.x && p.x - r < b.max.x &&
         p.y + player.height > b.min.y && p.y < b.max.y &&
         p.z + r > b.min.z && p.z - r < b.max.z;
}
// Move one axis at a time, then push out of anything we hit.
function moveAxis(axis, amount) {
  player.pos[axis] += amount;
  for (const b of solids) {
    if (!overlaps(b)) continue;
    if (axis === 'y') {
      if (amount <= 0) { player.pos.y = b.max.y; player.grounded = true; }
      else player.pos.y = b.min.y - player.height;
      player.vel.y = 0;
    } else {
      player.pos[axis] = amount > 0 ? b.min[axis] - CFG.radius : b.max[axis] + CFG.radius;
      player.vel[axis] = 0;
    }
  }
  collideBuildings(axis, amount);
}

function updatePlayer(dt) {
  // crouch (blocked from standing up under a ceiling)
  const wantCrouch = keys.KeyC || keys.ControlLeft || touchCrouch;
  const targetH = wantCrouch ? CFG.crouchHeight : CFG.standHeight;
  if (targetH > player.height) {
    const prev = player.height; player.height = targetH;
    if (solids.some(overlaps)) player.height = prev;
  } else player.height = targetH;
  const crouching = player.height < CFG.standHeight - 0.01;

  // wish direction relative to where we're looking
  const clamp1 = v => Math.max(-1, Math.min(1, v));
  const fwd = clamp1((keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y);
  const strafe = clamp1((keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  let wx = strafe * cos - fwd * sin, wz = -strafe * sin - fwd * cos;
  const len = Math.hypot(wx, wz); if (len > 1) { wx /= len; wz /= len; }   // analog input keeps partial speed

  const sprinting = (keys.ShiftLeft || Math.hypot(joy.x, joy.y) > 0.92) && fwd > 0 && !crouching;
  const speed = crouching ? CFG.crouchSpeed : sprinting ? CFG.sprintSpeed : CFG.walkSpeed;
  const accel = CFG.groundAccel * (player.grounded ? 1 : CFG.airControl) * dt;
  const approach = (v, t) => v + Math.max(-accel, Math.min(accel, t - v));
  player.vel.x = approach(player.vel.x, wx * speed);
  player.vel.z = approach(player.vel.z, wz * speed);

  // jump + gravity
  if ((keys.Space || touchJump) && player.grounded) player.vel.y = CFG.jumpSpeed;
  player.vel.y -= CFG.gravity * dt;

  // integrate with collision
  player.grounded = false;
  moveAxis('x', player.vel.x * dt);
  moveAxis('z', player.vel.z * dt);
  moveAxis('y', player.vel.y * dt);
  const dist = Math.hypot(player.pos.x, player.pos.z);   // stay inside the mapped circle
  const lim = CFG.mapRadius / mapRatio;
  if (dist > lim) { player.pos.x *= lim / dist; player.pos.z *= lim / dist; }
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.grounded = true; }

  // view effects: head bob + sprint FOV
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (player.grounded) player.bob += hSpeed * dt * CFG.bobSpeed / CFG.walkSpeed;
  const bobY = player.grounded ? Math.sin(player.bob) * CFG.bobAmount * Math.min(hSpeed / CFG.walkSpeed, 1) : 0;
  const targetFov = CFG.fov + (sprinting && hSpeed > 1 ? CFG.sprintFovBoost : 0);
  player.fov += (targetFov - player.fov) * Math.min(1, dt * 8);
  if (Math.abs(camera.fov - player.fov) > 0.01) { camera.fov = player.fov; camera.updateProjectionMatrix(); }

  // camera follows eye position
  camera.position.set(player.pos.x, player.pos.y + player.height - CFG.eyeOffset + bobY, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  document.getElementById('hud').textContent =
    `speed ${hSpeed.toFixed(1)} m/s · ${player.grounded ? 'grounded' : 'airborne'}${crouching ? ' · crouching' : ''}${buildingStatus}`;
}

/* ================= Map ground (OpenStreetMap tiles) =================
   World axes: +x = east, -z = north, 1 unit = 1 metre. The player's real location is (0, 0).
   Test without GPS: add ?lat=43.6426&lon=-79.3871 to the URL. */
/* Map scale: mapGroup is scaled about the origin (your real position), so changing the ratio
   never moves you relative to the map. Floor metre = mapRatio real metres. */
const mapGroup = new THREE.Group(); scene.add(mapGroup);          // ground texture (x/z scaled only)
const bGroup = new THREE.Group(); scene.add(bGroup);              // buildings (scaled uniformly, so heights shrink too)
let mapRatio = CFG.mapUnitsPerMetre;
const rs = document.getElementById('rs'), rv = document.getElementById('rv');
rs.min = Math.log10(CFG.ratioMin); rs.max = Math.log10(CFG.ratioMax); rs.step = 0.01;   // log slider
function setRatio(r) {
  const old = mapRatio;
  mapRatio = Math.min(CFG.ratioMax, Math.max(CFG.ratioMin, r));
  if (old !== mapRatio) player.pos.multiplyScalar(old / mapRatio);   // same real-world spot (incl. height on a roof)
  rs.value = Math.log10(mapRatio);
  mapGroup.scale.set(1 / mapRatio, 1, 1 / mapRatio);           // keep height at 1 to avoid z-fighting
  bGroup.scale.setScalar(1 / mapRatio);
  const f = mapRatio >= 10 ? mapRatio.toFixed(0) : mapRatio.toFixed(1);
  rv.textContent = `1 m × 1 m of floor = ${f} m × ${f} m of map (reach ${Math.round(CFG.mapRadius / mapRatio)} m)`;
}
rs.addEventListener('input', () => setRatio(10 ** rs.value));
rs.addEventListener('change', () => rs.blur());                 // so Space/arrows go back to the game
addEventListener('keydown', e => {
  if (e.code === 'BracketLeft') setRatio(mapRatio / 1.1);
  if (e.code === 'BracketRight') setRatio(mapRatio * 1.1);
});
setRatio(CFG.mapUnitsPerMetre);

/* ================= Buildings (OSM footprints -> oriented boxes) =================
   Each building becomes the smallest rotated rectangle around its footprint, extruded to its
   real height (height tag, else building:levels, else CFG.defaultBuildingHeight).
   Data stored in REAL metres; collision and rendering scale by 1 / mapRatio. */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const buildings = [];
let buildingStatus = '';

function minRect(pts) {                       // pts: [[x, z], ...] -> {x, z, hx, hz, c, s, ang}
  const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  const H = lo.slice(0, -1).concat(up.slice(0, -1));          // convex hull
  if (H.length < 3) return null;
  let best = null;
  for (let i = 0; i < H.length; i++) {                        // try each hull edge as the box's axis
    const a = H[i], b = H[(i + 1) % H.length], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const c = Math.cos(ang), s = Math.sin(ang);
    let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
    for (const p of H) {
      const u = p[0] * c + p[1] * s, v = -p[0] * s + p[1] * c;
      u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
    }
    const area = (u1 - u0) * (v1 - v0);
    if (!best || area < best.area) best = { area, ang, c, s, u0, u1, v0, v1 };
  }
  const mu = (best.u0 + best.u1) / 2, mv = (best.v0 + best.v1) / 2;
  return { x: mu * best.c - mv * best.s, z: mu * best.s + mv * best.c,
           hx: (best.u1 - best.u0) / 2, hz: (best.v1 - best.v0) / 2, c: best.c, s: best.s, ang: best.ang };
}

function heightOf(t) {
  const h = parseFloat(t.height); if (h > 0) return h;
  const l = parseFloat(t['building:levels']); if (l > 0) return l * CFG.levelHeight;
  return CFG.defaultBuildingHeight;
}

async function overpass(query) {                 // tries each mirror in turn
  let err;
  for (const url of OVERPASS) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
      const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query), signal: ctl.signal,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      clearTimeout(t);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return (await res.json()).elements;
    } catch (e) { err = e; }
  }
  throw err;
}

function renderBuildings(list) {                // list of [x, z, hx, hz, ang, h] in real metres
  if (!list.length) return;
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, 0.5, 0);   // unit cube sitting on y = 0
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }), list.length);
  mesh.frustumCulled = false;
  const d = new THREE.Object3D(), col = new THREE.Color();
  list.forEach(([x, z, hx, hz, ang, h], i) => {
    d.position.set(x, 0, z); d.rotation.set(0, -ang, 0); d.scale.set(hx * 2, h, hz * 2);
    d.updateMatrix(); mesh.setMatrixAt(i, d.matrix);
    col.setHSL(0.09, 0.12, 0.74 - Math.min(h, 60) / 60 * 0.3 + ((i * 37) % 11) / 200);  // taller = darker
    mesh.setColorAt(i, col);
    buildings.push({ x, z, hx, hz, h, ang, c: Math.cos(ang), s: Math.sin(ang), r: Math.hypot(hx, hz) });
  });
  bGroup.add(mesh);
  testMeshes.forEach(m => scene.remove(m)); testMeshes.length = 0; solids.length = 0;   // drop the demo blocks
}

/* Loads buildings in rings (nearest first). Results are cached in localStorage per ~100 m cell,
   so the next visit is instant. Coordinates are stored relative to the snapped cell centre. */
async function loadBuildings(lat, lon) {
  buildingStatus = ' · loading buildings…';
  const sLat = Math.round(lat * 1000) / 1000, sLon = Math.round(lon * 1000) / 1000;
  const kx = 111320 * Math.cos(sLat * Math.PI / 180), kz = 111132;
  const ox = (sLon - lon) * kx, oz = -(sLat - lat) * kz;           // cell centre relative to you
  const R = CFG.mapRadius + 100, key = `bld1:${sLat}:${sLon}:${R}`;
  const shift = l => l.map(a => [a[0] + ox, a[1] + oz, a[2], a[3], a[4], a[5]])
                      .filter(a => Math.hypot(a[0], a[1]) <= CFG.mapRadius);
  try {
    const hit = JSON.parse(localStorage.getItem(key) || 'null');
    if (hit) { renderBuildings(shift(hit)); buildingStatus = ` · ${buildings.length} buildings (cached)`; return; }
  } catch (e) {}
  const edges = [0, ...CFG.buildingRings.filter(r => r < R), R], all = [];
  try {
    for (let i = 1; i < edges.length; i++) {
      const [r0, r1] = [edges[i - 1], edges[i]];
      const around = r => `way["building"](around:${r},${sLat},${sLon})`;
      const q = `[out:json][timeout:25];${r0 ? `(${around(r1)};-${around(r0)};)` : around(r1)};out tags geom;`;
      const part = [];
      for (const w of await overpass(q)) {
        if (!w.geometry || w.geometry.length < 4) continue;
        const r = minRect(w.geometry.map(g => [(g.lon - sLon) * kx, -(g.lat - sLat) * kz]));   // -z = north
        if (r) part.push([r.x, r.z, Math.max(r.hx, 0.75), Math.max(r.hz, 0.75), r.ang, heightOf(w.tags || {})]);
      }
      all.push(...part);
      renderBuildings(shift(part));
      buildingStatus = ` · ${buildings.length} buildings (loading…)`;
    }
    try { localStorage.setItem(key, JSON.stringify(all.map(a => a.map(v => +v.toFixed(3))))); } catch (e) {}
    buildingStatus = ` · ${buildings.length} buildings`;
  } catch (e) { buildingStatus = ' · buildings failed (' + e.message + ')'; }
}

// Circle (player) vs rotated box. Walk into the sides; land on and walk across the roof.
function collideBuildings(axis, amount) {
  const k = 1 / mapRatio, p = player.pos, rad = CFG.radius;
  for (const b of buildings) {
    const bx = b.x * k, bz = b.z * k, top = b.h * k, R = b.r * k + rad;
    if (Math.abs(p.x - bx) > R || Math.abs(p.z - bz) > R || p.y >= top) continue;
    const dx = p.x - bx, dz = p.z - bz, hx = b.hx * k, hz = b.hz * k;
    const lx = dx * b.c + dz * b.s, lz = -dx * b.s + dz * b.c;           // player in box space
    const ex = lx - Math.max(-hx, Math.min(hx, lx)), ez = lz - Math.max(-hz, Math.min(hz, lz));
    const d2 = ex * ex + ez * ez;
    if (d2 >= rad * rad) continue;
    if (axis === 'y') { if (amount <= 0 && p.y - amount >= top - 0.05) { p.y = top; player.vel.y = 0; player.grounded = true; } continue; }
    let px, pz;                                                           // push-out in box space
    if (d2 > 1e-9) { const dd = Math.sqrt(d2); px = ex / dd * (rad - dd); pz = ez / dd * (rad - dd); }
    else if (hx - Math.abs(lx) < hz - Math.abs(lz)) { px = Math.sign(lx || 1) * (hx - Math.abs(lx) + rad); pz = 0; }
    else { px = 0; pz = Math.sign(lz || 1) * (hz - Math.abs(lz) + rad); }
    const wx = px * b.c - pz * b.s, wz = px * b.s + pz * b.c, m = Math.hypot(wx, wz) || 1;
    p.x += wx; p.z += wz;
    const vn = (player.vel.x * wx + player.vel.z * wz) / m;               // cancel velocity into the wall
    if (vn < 0) { player.vel.x -= wx / m * vn; player.vel.z -= wz / m * vn; }
  }
}

/* ================= Detail tiles =================
   The base mosaic is one texture for the whole map (soft up close). Around the player we also stream
   higher-zoom OSM tiles, with the zoom picked from the map scale so map pixels stay ~CFG.texelTarget
   world metres. Tiles live in mapGroup (real metres), so the slider scales them with everything else. */
const detail = new Map();                       // "z/x/y" -> { z, x, y, state, mesh }
let mapOrigin = null, baseZoom = 99, detailT = 0;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function disposeTile(e) {
  if (!e.mesh) return;
  mapGroup.remove(e.mesh); e.mesh.material.map.dispose(); e.mesh.material.dispose(); e.mesh.geometry.dispose();
}
function addDetailTile(key, z, x, y, cx, cy, ts) {
  const e = { z, x, y, state: 'loading', mesh: null }; detail.set(key, e);
  const n = 2 ** z;
  loadImage(TILE_URL.replace('{z}', z).replace('{x}', ((x % n) + n) % n).replace('{y}', y)).then(img => {
    if (detail.get(key) !== e) return;                          // removed while loading
    if (!img) { e.state = 'failed'; return; }
    const tex = new THREE.Texture(img); tex.needsUpdate = true; tex.anisotropy = maxAniso;
    e.mesh = new THREE.Mesh(new THREE.PlaneGeometry(ts, ts), new THREE.MeshBasicMaterial({
      map: tex, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    e.mesh.rotation.x = -Math.PI / 2;
    e.mesh.position.set((x + 0.5 - cx) * ts, 0.03, (y + 0.5 - cy) * ts);
    mapGroup.add(e.mesh); e.state = 'ready';
  });
}
function updateDetail() {
  if (!mapOrigin) return;
  const { lat, lon } = mapOrigin, rad = lat * Math.PI / 180;
  const zd = Math.min(19, Math.ceil(Math.log2(156543.03392 * Math.cos(rad) / (CFG.texelTarget * mapRatio))));
  const want = new Set();
  let px = 0, py = 0, rt = 0;
  if (zd > baseZoom) {                                          // otherwise the base mosaic is sharp enough
    const n = 2 ** zd, ts = 256 * 156543.03392 * Math.cos(rad) / n;    // tile size in real metres
    const cx = (lon + 180) / 360 * n, cy = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
    px = cx + player.pos.x * mapRatio / ts; py = cy + player.pos.z * mapRatio / ts;   // you, in tile coords
    rt = Math.min(CFG.detailRadius * mapRatio / ts, CFG.detailTiles);
    for (let ty = Math.max(0, Math.floor(py - rt)); ty <= Math.min(n - 1, Math.floor(py + rt)); ty++)
      for (let tx = Math.floor(px - rt); tx <= Math.floor(px + rt); tx++) {
        const key = `${zd}/${tx}/${ty}`; want.add(key);
        if (!detail.has(key)) addDetailTile(key, zd, tx, ty, cx, cy, ts);
      }
  }
  const ready = [...want].every(k => detail.get(k).state !== 'loading');
  for (const [k, e] of detail) {
    const far = Math.abs(e.x + 0.5 - px) > rt + 1.5 || Math.abs(e.y + 0.5 - py) > rt + 1.5;
    if (e.z === zd ? far : ready) { disposeTile(e); detail.delete(k); }   // old zoom goes once the new one is in
  }
}

const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const credit = document.getElementById('credit');
let locStarted = false;

function startLocation() {
  if (locStarted) return; locStarted = true;
  const q = new URLSearchParams(location.search);
  if (q.has('lat') && q.has('lon')) return loadMap(+q.get('lat'), +q.get('lon'));
  if (!navigator.geolocation) { credit.textContent = 'Location not supported: using flat ground'; return; }
  credit.textContent = 'Getting location…';
  navigator.geolocation.getCurrentPosition(
    p => loadMap(p.coords.latitude, p.coords.longitude),
    e => { credit.textContent = 'Location unavailable (' + e.message + '): using flat ground'; },
    { enableHighAccuracy: true, timeout: 15000 });
}

const loadImage = url => new Promise(res => {
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => res(img); img.onerror = () => res(null); img.src = url;
});

async function loadMap(lat, lon) {
  loadBuildings(lat, lon);                                       // runs in parallel with the tiles
  mapOrigin = { lat, lon };
  const rad = lat * Math.PI / 180, maxTex = Math.min(renderer.capabilities.maxTextureSize, 8192);
  let z = CFG.mapZoom, n, mpp, cx, cy, x0, x1, y0, y1, cols, rows;
  for (;; z--) {                                                 // lower the zoom until the mosaic fits in one texture
    n = 2 ** z;
    mpp = 156543.03392 * Math.cos(rad) / n;                      // real metres per source pixel
    cx = (lon + 180) / 360 * n;                                  // fractional tile coords of the player
    cy = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
    const rt = CFG.mapRadius / (mpp * 256);                      // radius in tiles
    x0 = Math.floor(cx - rt); x1 = Math.floor(cx + rt);
    y0 = Math.max(0, Math.floor(cy - rt)); y1 = Math.min(n - 1, Math.floor(cy + rt));
    cols = x1 - x0 + 1; rows = y1 - y0 + 1;
    if (Math.max(cols, rows) * 256 <= maxTex || z <= 12) break;
  }
  baseZoom = z;
  credit.textContent = `Loading ${cols * rows} map tiles…`;

  const canvas = document.createElement('canvas');
  canvas.width = cols * 256; canvas.height = rows * 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#d8d4c8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const jobs = [];
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const url = TILE_URL.replace('{z}', z).replace('{x}', ((tx % n) + n) % n).replace('{y}', ty);
    jobs.push(loadImage(url).then(img => { if (img) ctx.drawImage(img, (tx - x0) * 256, (ty - y0) * 256); return !!img; }));
  }
  const ok = (await Promise.all(jobs)).filter(Boolean).length;
  if (!ok) { credit.textContent = 'Map tiles blocked or offline: using flat ground'; return; }

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const w = canvas.width * mpp, h = canvas.height * mpp;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2;                              // texture top = north = -z
  ground.position.set(((cx - x0) * 256 * -1 + canvas.width / 2) * mpp, 0.02, ((cy - y0) * 256 * -1 + canvas.height / 2) * mpp);
  mapGroup.add(ground);
  grid.visible = false;
  credit.innerHTML = `${lat.toFixed(4)}, ${lon.toFixed(4)} · © <a style="color:inherit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors`;
  credit.style.pointerEvents = 'auto';
}

/* ================= Loop ================= */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now();
(function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (now - detailT > 350) { detailT = now; updateDetail(); }
  const steps = Math.ceil(dt / 0.016);          // substeps keep collisions stable on slow frames
  for (let i = 0; i < steps; i++) updatePlayer(dt / steps);
  renderer.render(scene, camera);
})(last);
</script>
</body>
