<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Atlas World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8ee;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#g{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#mm{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:170px;height:170px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:5;background:#ddd}
.me{color:#d93025;font-size:20px;text-align:center;line-height:20px;text-shadow:0 0 3px #fff}
#hud{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));right:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:5;pointer-events:none}
#st{font-weight:600;font-size:15px}
#joy{position:fixed;right:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);z-index:5;touch-action:none}
#kn{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.7)}
#at{position:fixed;left:190px;bottom:calc(8px + env(safe-area-inset-bottom,0px));color:#fff;font-size:10px;text-shadow:0 1px 2px #000;z-index:5}
</style></head><body>
<canvas id="g"></canvas><div id="mm"></div>
<div id="hud"><div id="st">Finding you…</div><div>WASD / joystick: walk · drag: look · Shift: run · tap minimap: travel</div></div>
<div id="joy"><div id="kn"></div></div><div id="at">Map data © OpenStreetMap contributors</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.abs(Math.sin(n*12.9898)*43758.5453)%1;
const R=new THREE.WebGLRenderer({canvas:$("#g"),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9cc8ee);sc.fog=new THREE.Fog(0x9cc8ee,120,450);
const cam=new THREE.PerspectiveCamera(60,1,.5,800);
sc.add(new THREE.HemisphereLight(0xffffff,0x667755,.95));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(100,200,60);sc.add(sun);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener("resize",rs);rs();
let lat0=43.7647,lon0=-79.1865,W=new THREE.Group(),solid=[];sc.add(W);
const KX=()=>111320*Math.cos(lat0*Math.PI/180),proj=(la,lo)=>[(lo-lon0)*KX(),-(la-lat0)*110540],unproj=(x,z)=>[lat0-z/110540,lon0+x/KX()];
// ---- data
async function fetchOSM(){const a=`(around:300,${lat0},${lon0})`,q=`[out:json][timeout:20];(way["building"]${a};way["highway"]${a};way["natural"="water"](around:400,${lat0},${lon0});way["leisure"~"park|garden|pitch"]${a};);out geom 1500;`;
 const j=await(await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)})).json(),D={roads:[],bld:[],water:[],park:[]};
 for(const e of j.elements){if(!e.geometry)continue;const pts=e.geometry.map(p=>proj(p.lat,p.lon)),t=e.tags||{};
  if(t.building)D.bld.push({pts,h:parseFloat(t.height)||(+t["building:levels"]||0)*3.2||6+rnd(e.id)*12,c:e.id});
  else if(t.highway)D.roads.push({pts,w:/motorway|trunk|primary/.test(t.highway)?11:/secondary|tertiary/.test(t.highway)?8:/foot|path|cycle|steps|pedestrian/.test(t.highway)?2:6});
  else if(t.natural=="water")D.water.push(pts);else D.park.push(pts)}return D}
function synth(){const D={roads:[],bld:[],water:[],park:[]};for(let i=-4;i<=4;i++){D.roads.push({pts:[[i*70,-300],[i*70,300]],w:i%2?6:9});D.roads.push({pts:[[-300,i*70],[300,i*70]],w:i%2?6:9})}
 for(let i=-4;i<4;i++)for(let j=-4;j<4;j++){const x=i*70+12,z=j*70+12;if(i==1&&j==1){D.park.push([[x,z],[x+46,z],[x+46,z+46],[x,z+46]]);continue}
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){const r=rnd(i*97+j*13+a*5+b);if(r>.15){const X=x+a*24,Z=z+b*24;D.bld.push({pts:[[X,Z],[X+20,Z],[X+20,Z+20],[X,Z+20]],h:6+r*40,c:r*1e4})}}}return D}
// ---- build
const pal=[0xd9d2c5,0xc9b8a6,0xb8c4cc,0xe2cdb4,0xa9a9b5,0xcfa89a].map(c=>new THREE.MeshLambertMaterial({color:c}));
const pip=(x,z,p)=>{let o=false;for(let i=0,j=p.length-1;i<p.length;j=i++)if((p[i][1]>z)!=(p[j][1]>z)&&x<(p[j][0]-p[i][0])*(z-p[i][1])/(p[j][1]-p[i][1])+p[i][0])o=!o;return o};
const box4=p=>{const X=p.map(a=>a[0]),Z=p.map(a=>a[1]);return{pts:p,x0:Math.min(...X),x1:Math.max(...X),z0:Math.min(...Z),z1:Math.max(...Z)}};
const shape=p=>new THREE.Shape(p.map(a=>new THREE.Vector2(a[0],-a[1])));
function flat(polys,col,y){for(const p of polys){if(p.length<3)continue;const g=new THREE.ShapeGeometry(shape(p));g.rotateX(-Math.PI/2);g.translate(0,y,0);W.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide})))}}
function build(D){W.traverse(o=>o.geometry&&o.geometry.dispose());sc.remove(W);W=new THREE.Group();sc.add(W);solid=[];
 const gr=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshLambertMaterial({color:0xc8c5b8}));gr.rotation.x=-Math.PI/2;W.add(gr);
 flat(D.park,0x8fbf73,.08);flat(D.water,0x6fa8dc,.12);D.water.forEach(p=>solid.push(box4(p)));
 const pos=[],col=[];for(const r of D.roads){const c=new THREE.Color(r.w==2?0xa89f91:0x3d4148);
  for(let i=1;i<r.pts.length;i++){const[a,b]=[r.pts[i-1],r.pts[i]],dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz);if(!l)continue;const nx=-dz/l*r.w/2,nz=dx/l*r.w/2,
   v=[[a[0]+nx,a[1]+nz],[a[0]-nx,a[1]-nz],[b[0]+nx,b[1]+nz],[b[0]-nx,b[1]-nz]];for(const k of[0,1,2,1,3,2]){pos.push(v[k][0],.16,v[k][1]);col.push(c.r,c.g,c.b)}}}
 const rg=new THREE.BufferGeometry();rg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));rg.setAttribute("color",new THREE.Float32BufferAttribute(col,3));W.add(new THREE.Mesh(rg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})));
 for(const b of D.bld){if(b.pts.length<3)continue;const g=new THREE.ExtrudeGeometry(shape(b.pts),{depth:b.h,bevelEnabled:false});g.rotateX(-Math.PI/2);W.add(new THREE.Mesh(g,pal[Math.floor(rnd(b.c)*6)]));solid.push(box4(b.pts))}
 const T=[];for(const p of D.park){const bb=box4(p);for(let k=0;k<30;k++){const x=bb.x0+Math.random()*(bb.x1-bb.x0),z=bb.z0+Math.random()*(bb.z1-bb.z0);if(pip(x,z,p))T.push([x,z])}}
 if(T.length){const f=new THREE.InstancedMesh(new THREE.ConeGeometry(2,5,6),new THREE.MeshLambertMaterial({color:0x3f8f4a}),T.length),t=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,.4,1.6),new THREE.MeshLambertMaterial({color:0x6b4a2f}),T.length),d=new THREE.Object3D();
  T.forEach((p,i)=>{const s=.7+Math.random()*.8;d.scale.set(s,s,s);d.position.set(p[0],3.2*s,p[1]);d.updateMatrix();f.setMatrixAt(i,d.matrix);d.position.set(p[0],.8*s,p[1]);d.updateMatrix();t.setMatrixAt(i,d.matrix)});W.add(f,t)}}
const blocked=(x,z)=>solid.some(b=>x>b.x0&&x<b.x1&&z>b.z0&&z<b.z1&&pip(x,z,b.pts));
// ---- player
const P=new THREE.Group(),mt=c=>new THREE.MeshLambertMaterial({color:c}),bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mt(c));m.position.set(x,y,z);return m},
 limb=(x,y,h,c)=>{const g=new THREE.Group();g.position.set(x,y,0);g.add(bx(.25,h,.25,c,0,-h/2,0));return g},
 lL=limb(-.17,.8,.8,0x2b3a67),lR=limb(.17,.8,.8,0x2b3a67),aL=limb(-.42,1.55,.7,0xf1c27d),aR=limb(.42,1.55,.7,0xf1c27d);
P.add(bx(.6,.8,.35,0xe0533d,0,1.2,0),bx(.4,.4,.4,0xf1c27d,0,1.85,0),bx(.42,.15,.42,0x333333,0,2.1,0),lL,lR,aL,aR);sc.add(P);
let px=0,pz=0,yaw=0,pit=.5,dst=9,face=0,wt=0;
// ---- minimap
const mm=L.map("mm",{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false}).setView([lat0,lon0],17);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(mm);
const mk=L.marker([lat0,lon0],{icon:L.divIcon({className:"",html:'<div class="me">▲</div>',iconSize:[20,20]}),interactive:false}).addTo(mm);
mm.on("click",e=>load(e.latlng.lat,e.latlng.lng));
async function load(la,lo){lat0=la;lon0=lo;$("#st").textContent="Generating world from map data…";let D;
 try{D=await fetchOSM();if(D.bld.length+D.roads.length<3)throw 0;$("#st").textContent="Real map data loaded"}catch(e){D=synth();$("#st").textContent="Map data unavailable, generated a sample city"}
 build(D);px=pz=0;for(let r=0;blocked(px,pz)&&r<80;r+=2){const a=r*1.7;px=Math.cos(a)*r;pz=Math.sin(a)*r}mm.setView([la,lo],17,{animate:false});setTimeout(()=>$("#st").textContent="",4000)}
// ---- input
const K={};addEventListener("keydown",e=>K[e.key.toLowerCase()]=1);addEventListener("keyup",e=>K[e.key.toLowerCase()]=0);
let jx=0,jy=0;const joy=$("#joy"),kn=$("#kn");
function jm(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-65,y=e.clientY-r.top-65;const l=Math.hypot(x,y),m=50;if(l>m){x*=m/l;y*=m/l}kn.style.transform=`translate(${x}px,${y}px)`;jx=x/m;jy=-y/m}
joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);jm(e)});joy.addEventListener("pointermove",e=>e.buttons&&jm(e));
const je=()=>{jx=jy=0;kn.style.transform=""};joy.addEventListener("pointerup",je);joy.addEventListener("pointercancel",je);
const cv=$("#g");let dr=null;cv.addEventListener("pointerdown",e=>{dr=e.pointerId;cv.setPointerCapture(dr)});cv.addEventListener("pointerup",()=>dr=null);
cv.addEventListener("pointermove",e=>{if(e.pointerId==dr){yaw-=e.movementX*.006;pit=Math.max(.1,Math.min(1.3,pit+e.movementY*.004))}});
let lx,ly;cv.addEventListener("touchstart",e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY},{passive:true});
cv.addEventListener("touchmove",e=>{const t=e.touches[0];yaw-=(t.clientX-lx)*.006;pit=Math.max(.1,Math.min(1.3,pit+(t.clientY-ly)*.004));lx=t.clientX;ly=t.clientY},{passive:true});
cv.addEventListener("wheel",e=>dst=Math.max(4,Math.min(30,dst+e.deltaY*.01)));
// ---- loop
let last=performance.now(),mt0=0;
function tick(n){const dt=Math.min(.05,(n-last)/1000);last=n;
 let ix=jx+(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),iy=jy+(K.w||K.arrowup?1:0)-(K.s||K.arrowdown?1:0);const m=Math.min(1,Math.hypot(ix,iy));
 if(m>.05){const s=Math.sin(yaw),c=Math.cos(yaw),dx=ix*c-iy*s,dz=-ix*s-iy*c,l=Math.hypot(dx,dz),v=(K.shift?10:5)*m*dt;
  const nx=px+dx/l*v,nz=pz+dz/l*v;if(!blocked(nx,pz))px=nx;if(!blocked(px,nz))pz=nz;
  let d=Math.atan2(dx,dz)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*12);wt+=dt*(K.shift?14:9)*m;
  lL.rotation.x=Math.sin(wt)*.8;lR.rotation.x=-Math.sin(wt)*.8;aL.rotation.x=-Math.sin(wt)*.7;aR.rotation.x=Math.sin(wt)*.7;
  if(n-mt0>150){mt0=n;const[la,lo]=unproj(px,pz);mk.setLatLng([la,lo]);mm.setView([la,lo],17,{animate:false});const el=mk.getElement();el&&(el.firstChild.style.transform=`rotate(${(Math.PI-face)*180/Math.PI}deg)`)}}
 else{lL.rotation.x*=.8;lR.rotation.x*=.8;aL.rotation.x*=.8;aR.rotation.x*=.8}
 P.position.set(px,0,pz);P.rotation.y=face;
 cam.position.set(px+Math.sin(yaw)*Math.cos(pit)*dst,1.6+Math.sin(pit)*dst,pz+Math.cos(yaw)*Math.cos(pit)*dst);cam.lookAt(px,1.6,pz);
 R.render(sc,cam);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude),()=>load(lat0,lon0),{timeout:8000}):load(lat0,lon0);
</script></body></html>
